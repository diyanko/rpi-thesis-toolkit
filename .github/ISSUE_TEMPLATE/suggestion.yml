name: Suggest an improvement
description: Point out unclear instructions or a missing step. No LaTeX expertise needed.
title: "Suggestion: "
labels: ["enhancement"]
body:
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: For example, add my first citation, or install LaTeX on Windows.
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing or missing?
      description: A page name or a short example helps. Please leave out private research and personal details.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What might help?
      placeholder: An example, a clearer sentence, a picture, or a different way to do it.
  - type: input
    id: setup
    attributes:
      label: Your setup, if relevant
      placeholder: For example, Overleaf; Windows with VS Code and LaTeX Workshop; macOS with TeXShop; Linux with TeXstudio.
  - type: input
    id: credit
    attributes:
      label: Optional public credit
      description: If your suggestion leads to a change, the name you would like listed in the project's credits (CREDITS.md). Leave blank for no credit. Do not enter an email address or student ID.
