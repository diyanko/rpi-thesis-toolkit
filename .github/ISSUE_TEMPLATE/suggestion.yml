name: Suggest an improvement or share a tip
description: Point out an unclear or missing step, share something that saved you time, or offer to help. No LaTeX expertise needed.
title: "Suggestion: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping the next student. Write in your own words; short is fine. Screenshots are welcome: paste or drag them into any box. Please leave out private research and personal details.

        Tips are welcome too: something that saved you time, a fix for an edge case, a note for your department, or a related document (a journal or conference version, slides, a poster).
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do, or what does your tip help with?
      placeholder: For example, add my first citation, install LaTeX on Windows, keep figure numbers right after moving a chapter, or help review pull requests.
    validations:
      required: true
  - type: textarea
    id: confusing
    attributes:
      label: What was confusing or missing, or how do you do it? (optional)
      description: A page name, the steps, a short example, or a link to a tool's own page.
  - type: textarea
    id: suggestion
    attributes:
      label: What might help? (optional)
      placeholder: An example, a clearer sentence, a picture, or a different way to do it.
  - type: input
    id: setup
    attributes:
      label: Your setup or department, if relevant (optional)
      placeholder: For example, Overleaf; Windows with VS Code; macOS with TeXShop; Physics; doctoral dissertations.
  - type: input
    id: credit
    attributes:
      label: Public credit (optional)
      description: If your suggestion or tip leads to a change, the name you would like listed in the project's credits. Leave blank for no credit. Do not enter an email address or student ID.
