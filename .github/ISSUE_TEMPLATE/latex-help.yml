name: LaTeX help or bug
description: Ask a question, report an error, or show a PDF page that does not look right.
title: "Help: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for asking. This is an unofficial community project, and this form is public: use made-up text, and remove private research, names, and file paths from your computer. For an official formatting ruling, contact the Office of Graduate Education (OGE).
  - type: textarea
    id: expected
    attributes:
      label: What were you trying to do, and what happened?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: First error or a small example
      description: Copy the first error with its file and line number, or describe the PDF problem and the page. Please do not upload a whole thesis.
      render: text
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Editor, operating system, and toolkit version
      description: The toolkit version is in the first lines of rpi-thesis.cls (for example v0.1.0).
      placeholder: For example, Overleaf; VS Code with LaTeX Workshop on Windows; or TeXShop on macOS.
    validations:
      required: true
  - type: input
    id: authority
    attributes:
      label: Official requirement, if this is a formatting question
      description: The OGE document, section, and page, if you know them.
  - type: input
    id: credit
    attributes:
      label: Optional public credit
      description: If your report leads to a change, the name you would like listed in the project's credits (CREDITS.md). Leave blank for no credit. Do not enter an email address or student ID.
