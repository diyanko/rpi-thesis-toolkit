name: Fresh-machine test

# Check that brand-new computers can follow docs/get-started.md: install TeX
# the way the guide says, then compile the unchanged starter. Runs on each
# release tag, once a month, and on demand (about an hour; the Windows TeX
# Live install is the slow part). It never blocks a release; a failure means
# a fix release.
# GitHub's hosted Windows image is Windows Server, not Windows 11 itself; it
# stands in for a Windows computer. Runner images are named explicitly so a
# retiring image is noticed here, not silently changed.

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '41 7 3 * *'  # 07:41 UTC on the 3rd of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Windows Server 2025 (windows-2025) + TeX Live (official installer)", os: windows-2025 }
          - { name: "macOS 15 (Apple Silicon, macos-15) + MacTeX", os: macos-15 }
          - { name: "Ubuntu 24.04 + distribution TeX Live", os: ubuntu-24.04 }
          # Jammy's TeX Live 2021 is older than the class's minimum kernel.
          # https://packages.ubuntu.com/jammy/texlive-base
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install TeX Live (Windows, full scheme, as the guide says)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://mirror.ctan.org/systems/texlive/tlnet/install-tl.zip -OutFile install-tl.zip
          Expand-Archive install-tl.zip -DestinationPath C:\tl-installer
          $dir = Get-ChildItem C:\tl-installer -Directory | Select-Object -First 1
          @"
          selected_scheme scheme-full
          TEXDIR C:/texlive/current
          TEXMFLOCAL C:/texlive/texmf-local
          TEXMFSYSCONFIG C:/texlive/current/texmf-config
          TEXMFSYSVAR C:/texlive/current/texmf-var
          instopt_adjustpath 0
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          tlpdbopt_autobackup 0
          "@ | Set-Content -Encoding ascii C:\tl.profile
          & "$($dir.FullName)\install-tl-windows.bat" -no-gui -profile C:\tl.profile
          "C:\texlive\current\bin\windows" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install MacTeX (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install --cask mactex-no-gui
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"

      - name: Install distribution TeX Live (Ubuntu, full package)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-full

      - name: Report versions
        shell: bash
        run: |
          pdflatex --version | head -1
          biber --version | head -1
          latexmk -v | head -2 | tail -1

      - name: Build helper doctor
        shell: bash
        run: python3 scripts/build.py --doctor || python scripts/build.py --doctor

      - name: Compile with latexmk directly (the guide's terminal command)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/plain"
          cp -R main.tex metadata.tex preamble.tex rpi-thesis.cls references.bib chapters frontmatter appendices figures assets "$RUNNER_TEMP/plain/"
          cd "$RUNNER_TEMP/plain"
          latexmk -norc -pdf -no-shell-escape -interaction=nonstopmode -halt-on-error main.tex
          test -s main.pdf
          ! grep -E "There were undefined references|Citation .* undefined|Empty bibliography" main.log

      - name: Compile the way the editor does (output folder, first run, project latexmkrc)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/editor"
          cp -R main.tex metadata.tex preamble.tex rpi-thesis.cls references.bib latexmkrc chapters frontmatter appendices figures assets "$RUNNER_TEMP/editor/"
          cd "$RUNNER_TEMP/editor"
          latexmk -pdf -no-shell-escape -synctex=1 -interaction=nonstopmode -halt-on-error -file-line-error -outdir="$RUNNER_TEMP/editor/build" main.tex
          test -s build/main.pdf

      - name: Compile with the build helper in a folder with a space
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/My Thesis"
          cp -R main.tex metadata.tex preamble.tex rpi-thesis.cls references.bib chapters frontmatter appendices figures assets scripts "$RUNNER_TEMP/My Thesis/"
          cd "$RUNNER_TEMP/My Thesis"
          (python3 scripts/build.py --fresh || python scripts/build.py --fresh)
          test -s build/main.pdf

      - name: "Info only: folder with accented letters"
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/Thèse étudiante"
          cp -R main.tex metadata.tex preamble.tex rpi-thesis.cls references.bib chapters frontmatter appendices figures assets scripts "$RUNNER_TEMP/Thèse étudiante/"
          cd "$RUNNER_TEMP/Thèse étudiante"
          (python3 scripts/build.py --fresh || python scripts/build.py --fresh)
          test -s build/main.pdf
