name: Build thesis, website, and starter ZIP

# Runs the same command a maintainer runs locally: python3 scripts/verify.py.
# - Pull requests and pushes to main: verify. A push to main also deploys the
#   website when its class equals the latest release's (scripts/release.py
#   deployable), so guide fixes go live at once and class changes wait for a
#   release.
# - A pushed tag vX.Y.Z (made after scripts/bump.py): verify in release mode,
#   create the GitHub pre-release with both ZIPs and rpi-thesis.cls, deploy,
#   and check the live links (docs/project/maintenance.md, "Make a release").
# No thesis PDFs are uploaded; the only PDF in the artifacts is the one-page
# cheat sheet. The repository holds no RPI seal, so CI checks the title page
# with its placeholder.

on:
  pull_request:
    paths-ignore: ['.github/ISSUE_TEMPLATE/**', '.github/pull_request_template.md']
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['.github/ISSUE_TEMPLATE/**', '.github/pull_request_template.md']
  workflow_dispatch:  # a re-run on main deploys under the same rule as a push

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in step with the Pandoc you use locally (pandoc --version).
  PANDOC_VERSION: '3.11'
  PANDOC_SHA256: 89d4c9d97818c62a97157f0072844e4602c6cee795bf84abd1aee7273abcda99
  # pypdf for scripts/check.py, installed with pip (not the distribution's
  # python3-pypdf, whose version varies) so CI reads PDFs as maintainers do.
  # To update: run check.py locally with the new version, then copy the
  # version and the sha256 of its py3-none-any wheel from
  # https://pypi.org/project/pypdf/#files (or: pip hash <wheel>).
  PYPDF_VERSION: '6.20.1'
  PYPDF_SHA256: aa5a55ddcffdc5e5ab291d5decb23f6383f4e56f8e3263dc39af41fff03885ad

jobs:
  build:
    runs-on: ubuntu-24.04
    # TeX Live 2026 ("latest" image of 2026-10-11), pinned by digest. To update:
    # docs/project/maintenance.md, "Updating pinned tools".
    container: texlive/texlive:latest@sha256:0f4884ca7d287f47ab466d2dd405d4c901c576585363f628863a7ca7eea21301
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # full history: each guide page shows when it last changed
      - name: Install Pandoc, poppler (page previews), and pypdf (PDF checks)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl poppler-utils python3 python3-pip
          echo "pypdf==${PYPDF_VERSION} --hash=sha256:${PYPDF_SHA256}" > /tmp/pypdf-requirements.txt
          python3 -m pip install --break-system-packages --no-cache-dir --require-hashes -r /tmp/pypdf-requirements.txt
          python3 -c "import pypdf; print('pypdf', pypdf.__version__)"
          curl -fsSL -o /tmp/pandoc.deb "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          echo "${PANDOC_SHA256}  /tmp/pandoc.deb" | sha256sum -c -
          dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1
      - name: Verify (release mode for a tag)
        run: python3 scripts/verify.py ${{ github.ref_type == 'tag' && 'release' || 'full' }} --keep-going
      - name: Decide whether to deploy the website
        id: gate
        if: github.event_name != 'pull_request'
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            want="v$(python3 -c 'import sys; sys.path.insert(0, "scripts"); import build_site; print(build_site.RELEASE_VERSION)')"
            if [ "$GITHUB_REF_NAME" != "$want" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match $want in scripts/build_site.py (run scripts/bump.py)"
              exit 1
            fi
            echo deploy=true >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ] && python3 scripts/release.py deployable; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the website in publish mode (strict checks)
        if: steps.gate.outputs.deploy == 'true'
        run: python3 scripts/build_site.py --previews --publish
      - name: Keep the verify logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-logs
          path: build/verify
      - name: Keep the starter ZIP
        uses: actions/upload-artifact@v7
        with:
          name: starter-zip
          path: |
            dist/rpi-thesis-starter-v*.zip
            dist/rpi-thesis-overleaf-v*.zip
          if-no-files-found: error
      - name: Keep the website
        uses: actions/upload-artifact@v7
        with:
          name: website
          path: dist/site
          if-no-files-found: error
      - name: Configure Pages
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v6
      - name: Stage the website for Pages
        if: steps.gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: starter-zip
          path: dist
      - name: Create the GitHub pre-release (the ZIPs tested above, plus the class alone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release.py notes > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag \
            dist/rpi-thesis-*.zip rpi-thesis.cls

  deploy:
    needs: [build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.deploy == 'true' && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-24.04
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v5
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the live site and downloads
        run: python3 scripts/release.py live
