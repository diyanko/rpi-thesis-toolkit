<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 704" width="360" height="704" role="img" aria-labelledby="t d">
  <title id="t">Submission timeline</title>
  <desc id="d">Submission timeline. Step 1: finish a complete draft and check its attributions and citations. Step 2: request OGE's preliminary formatting review at least a week before your defense. Step 3: defend. Step 4: finish the content revisions your committee asks for. Step 5: complete signatures and paperwork. Step 6: upload your final PDF to ProQuest promptly. Step 7: expect several rounds of formatting revisions until OGE approves.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="784">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="360" height="704" rx="18"/>
  <path class="ln sage dash" filter="url(#r)" d="M36 62 C 33 82.4, 39 103.6, 36 122" marker-end="url(#as)"/>
  <path class="ln sage dash" filter="url(#r)" d="M36 168 C 33 188.4, 39 209.6, 36 228" marker-end="url(#as)"/>
  <path class="ln sage dash" filter="url(#r)" d="M36 274 C 33 280.0, 39 294.0, 36 298" marker-end="url(#as)"/>
  <path class="ln sage dash" filter="url(#r)" d="M36 344 C 33 350.0, 39 364.0, 36 368" marker-end="url(#as)"/>
  <path class="ln sage dash" filter="url(#r)" d="M36 414 C 33 426.4, 39 443.6, 36 454" marker-end="url(#as)"/>
  <path class="ln sage dash" filter="url(#r)" d="M36 500 C 33 512.4, 39 529.6, 36 540" marker-end="url(#as)"/>
  <path class="ln sage dash" filter="url(#r)" d="M36 586 C 33 603.2, 39 622.8, 36 638" marker-end="url(#as)"/>
  <circle class="w-butter" cx="36" cy="40" r="17"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="40" r="17"/>
  <text class="n mid" x="36" y="47" style="font-size:20px">1</text>
  <text x="66" y="46" style="font-size:16.5px" font-weight="700">Finish a complete draft</text>
  <text class="s" x="66" y="67" style="font-size:14.5px">and check its attributions</text>
  <text class="s" x="66" y="86" style="font-size:14.5px">and citations</text>
  <circle class="w-butter" cx="36" cy="146" r="17"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="146" r="17"/>
  <text class="n mid" x="36" y="153" style="font-size:20px">2</text>
  <text x="66" y="152" style="font-size:16.5px" font-weight="700">Request a preliminary</text>
  <text x="66" y="173" style="font-size:16.5px" font-weight="700">formatting review</text>
  <text class="hand" x="66" y="196" style="font-size:15.5px">at least a week before you defend</text>
  <circle class="w-terra" cx="36" cy="252" r="17"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="252" r="17"/>
  <text class="n mid" x="36" y="259" style="font-size:20px">3</text>
  <text x="66" y="258" style="font-size:16.5px" font-weight="700">Defend</text>
  <circle class="w-butter" cx="36" cy="322" r="17"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="322" r="17"/>
  <text class="n mid" x="36" y="329" style="font-size:20px">4</text>
  <text x="66" y="328" style="font-size:16.5px" font-weight="700">Finish the content revisions</text>
  <circle class="w-butter" cx="36" cy="392" r="17"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="392" r="17"/>
  <text class="n mid" x="36" y="399" style="font-size:20px">5</text>
  <text x="66" y="398" style="font-size:16.5px" font-weight="700">Complete signatures</text>
  <text x="66" y="419" style="font-size:16.5px" font-weight="700">and paperwork</text>
  <circle class="w-butter" cx="36" cy="478" r="17"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="478" r="17"/>
  <text class="n mid" x="36" y="485" style="font-size:20px">6</text>
  <text x="66" y="484" style="font-size:16.5px" font-weight="700">Upload your final PDF</text>
  <text x="66" y="505" style="font-size:16.5px" font-weight="700">to ProQuest promptly</text>
  <circle class="w-butter" cx="36" cy="564" r="17"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="564" r="17"/>
  <text class="n mid" x="36" y="571" style="font-size:20px">7</text>
  <text x="66" y="570" style="font-size:16.5px" font-weight="700">Expect several rounds of</text>
  <text x="66" y="591" style="font-size:16.5px" font-weight="700">formatting revisions</text>
  <text class="hand hp" x="66" y="614" style="font-size:15.5px">several rounds, until OGE approves</text>
  <circle class="w-sage" cx="40" cy="666" r="21"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="662" r="21"/>
  <path class="ln" d="M28 675 V 648"/>
  <path class="f-red" d="M29 648 C 38 644, 42 654, 50 651 L 48 661 C 40 664, 36 654, 29 658 Z"/>
  <text x="66" y="668" style="font-size:16.5px" font-weight="700">OGE approves</text>
</svg>
