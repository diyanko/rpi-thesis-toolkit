  <rect class="w-terra" x="116.84" y="289" width="40" height="13" opacity=".9"/>
  <text class="mid" x="136.84" y="317" style="font-size:14.5px">Writing basics</text>
  </g>
  <g transform="rotate(1.5 268.22 312)">
  <rect class="w-butter" x="217.68" y="296" width="101.08" height="32" rx="3"/>
