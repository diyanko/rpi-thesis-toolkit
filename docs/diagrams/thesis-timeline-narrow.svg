  <g transform="rotate(-1.5 120.6 697)">
  <rect class="w-butter" x="66" y="681" width="109.2" height="32" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="66" y="681" width="109.2" height="32" rx="3"/>
  <rect class="w-terra" x="100.6" y="674" width="40" height="13" opacity=".9"/>
