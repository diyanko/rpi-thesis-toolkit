  <rect class="ln thin" filter="url(#r)" x="66" y="509" width="109.2" height="32" rx="3"/>
  <rect class="w-terra" x="100.6" y="502" width="40" height="13" opacity=".9"/>
  <text class="mid" x="120.6" y="530" style="font-size:14.5px">Submitting</text>
