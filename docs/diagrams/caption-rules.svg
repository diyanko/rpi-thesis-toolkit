<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" width="720" height="568" role="img" aria-labelledby="t d">
  <title id="t">Where captions and equation numbers go</title>
  <desc id="d">A sketch of one thesis page showing the formatting rules OGE checks most often, as the class prints them. 1: a table's caption goes above the table, in bold, with a colon after the number: Table 2.1: Values for three groups. 2: a figure's caption goes below the figure in the same style: Figure 2.1: A sample image. 3: a displayed equation, y = mx + b, has its number (2.1) in parentheses on the same line, at the right margin. 4: an equation that runs over two lines has one number, (2.2), centered vertically beside the lines. 5: the list of figures entry, 2.1 A sample image, repeats the full caption word for word, so do not write a short caption with \caption[short]{...}.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="648">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="720" height="568" rx="18"/>
  <text class="hand" x="28" y="28" style="font-size:17px">a chapter page, as the class prints it</text>
  <path class="w-sage" transform="translate(6 6)" d="M28 44 H378 L400 66 V540 H28 Z"/>
  <path class="card" d="M28 44 H378 L400 66 V540 H28 Z"/>
  <rect x="78" y="70" width="300" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <rect x="52" y="84" width="266" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <text x="52" y="116" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-weight="700"><tspan font-weight="700">Table 2.1:</tspan> Values for three groups.</text>
  <path class="ln thin" d="M140 128 H290 M140 150 H290 M140 194 H290"/>
  <text x="148" y="144" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">Group</text>
  <text class="end" x="282" y="144" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">Value</text>
  <text x="148" y="167" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">A</text>
  <text class="end" x="282" y="167" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">12</text>
  <text x="148" y="187" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">B</text>
  <text class="end" x="282" y="187" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">18</text>
  <rect x="78" y="218" width="300" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <rect x="52" y="232" width="286" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <rect class="ln thin" x="140" y="248" width="150" height="60" rx="2"/>
  <path class="ln thin sage" d="M154 298 L192 264 L218 286 L238 270 L276 298"/>
  <circle class="ln thin terra" cx="258" cy="262" r="6"/>
  <text x="52" y="330" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-weight="700"><tspan font-weight="700">Figure 2.1:</tspan> A sample image.</text>
  <rect x="78" y="356" width="300" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <rect x="52" y="370" width="256" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <text class="mid" x="215" y="406" style="font-size:16px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic">y = mx + b.</text>
  <path class="ln thin mut dot" d="M267 401 H332"/>
  <text class="end" x="378" y="406" style="font-size:15px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">(2.1)</text>
  <rect x="52" y="432" width="306" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <text class="end" x="193" y="464" style="font-size:16px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic">(a + b)²</text>
  <text x="201" y="464" style="font-size:16px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic">= (a + b)(a + b)</text>
  <text x="201" y="490" style="font-size:16px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic">= a² + 2ab + b².</text>
  <text class="end" x="378" y="482" style="font-size:15px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">(2.2)</text>
  <rect x="52" y="520" width="276" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <path class="ln" filter="url(#r)" d="M28 44 H378 L400 66 V540 H28 Z M378 44 V66 H400"/>
  <text class="hand" x="432" y="110" style="font-size:17px">caption above the table</text>
  <text class="s" x="432" y="131" style="font-size:14px">bold, colon after the number</text>
  <path class="ln terra" filter="url(#r)" d="M424 105 C 402 104, 372 111, 342 111" marker-end="url(#at)"/>
  <text class="hand" x="432" y="324" style="font-size:17px">caption below the figure</text>
  <text class="s" x="432" y="345" style="font-size:14px">same bold label and colon</text>
  <path class="ln terra" filter="url(#r)" d="M424 319 C 402 318, 302 325, 272 325" marker-end="url(#at)"/>
  <text class="hand" x="432" y="400" style="font-size:17px">number on the same line,</text>
  <text class="s" x="432" y="421" style="font-size:14px">in parentheses, at the right margin</text>
  <path class="ln terra" filter="url(#r)" d="M424 395 C 402 394, 416 401, 386 401" marker-end="url(#at)"/>
  <text class="hand" x="432" y="476" style="font-size:17px">one number, centered,</text>
  <text class="s" x="432" y="497" style="font-size:14px">for a multi-line equation</text>
  <path class="ln terra" filter="url(#r)" d="M424 471 C 402 470, 416 477, 386 477" marker-end="url(#at)"/>
  <rect class="w-blue" x="437" y="145" width="270" height="64" rx="4"/>
  <rect class="card" x="432" y="140" width="270" height="64" rx="4"/>
  <rect class="ln" filter="url(#r)" x="432" y="140" width="270" height="64" rx="4"/>
  <text class="mid" x="567" y="164" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-weight="700">LIST OF FIGURES</text>
  <text x="446" y="188" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">2.1</text>
  <text x="478" y="188" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">A sample image.</text>
  <path class="ln thin mut dot" d="M588 185 H670"/>
  <text class="end" x="688" y="188" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">2</text>
  <text class="hand" x="432" y="236" style="font-size:17px">the list shows the full caption,</text>
  <text class="hand" x="432" y="258" style="font-size:17px">word for word: don't use</text>
  <text class="code" x="432" y="282" style="font-size:15px"><tspan style="fill:var(--ink)">\caption[short]{…}</tspan></text>
  <path class="ln terra dash" filter="url(#r)" d="M300 314 C 330 260, 380 200, 424 184" marker-end="url(#at)"/>
</svg>
