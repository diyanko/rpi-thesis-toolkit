<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 568" width="720" height="568" role="img" aria-labelledby="t d">
  <title id="t">Where captions and equation numbers go</title>
  <desc id="d">A sketch of one thesis page showing the formatting rules OGE checks most often, as the class prints them. 1: a table's caption goes above the table, in bold, with a colon after the number: Table 2.1: Values for three groups. 2: a figure's caption goes below the figure in the same style: Figure 2.1: A sample image. 3: a displayed equation, y = mx + b, has its number (2.1) in parentheses on the same line, at the right margin. 4: an equation that runs over two lines has one number, (2.2), centered vertically beside the lines. 5: the list of figures entry, 2.1 A sample image, repeats the full caption word for word, so do not write a short caption with \caption[short]{...}.</desc>
  <style>
    svg { --bg: #faf5ea; --card: #fffcf5; --ink: #2d2620; --muted: #625547;
      --terra: #a24a24; --sage: #4a6b42; --plum: #70466a; --blue: #24518c; --red: #c8102e;
      --terra-w: #f6dfcd; --sage-w: #e4ecd2; --plum-w: #f1e0ea; --blue-w: #e0e6ef; --butter-w: #f7e8b3; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #181614; --card: #27231e; --ink: #f2ece2; --muted: #b9ae9d;
        --terra: #f6a57f; --sage: #a6d49a; --plum: #e0b6dc; --blue: #a2c8fb; --red: #ff8d98;
        --terra-w: #3b2418; --sage-w: #21321f; --plum-w: #34233a; --blue-w: #1d2c43; --butter-w: #3a3118; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
