<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 934" width="360" height="934" role="img" aria-labelledby="t d">
  <title id="t">Where captions and equation numbers go</title>
  <desc id="d">A sketch of one thesis page showing the formatting rules OGE checks most often, as the class prints them. 1: a table's caption goes above the table, in bold, with a colon after the number: Table 2.1: Values for three groups. 2: a figure's caption goes below the figure in the same style: Figure 2.1: A sample image. 3: a displayed equation, y = mx + b, has its number (2.1) in parentheses on the same line, at the right margin. 4: an equation that runs over two lines has one number, (2.2), centered vertically beside the lines. 5: the list of figures entry, 2.1 A sample image, repeats the full caption word for word, so do not write a short caption with \caption[short]{...}.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="1014">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="360" height="934" rx="18"/>
  <text class="hand" x="24" y="26" style="font-size:15px">a chapter page, as the class prints it</text>
  <path class="w-sage" transform="translate(6 6)" d="M24 40 H314 L336 62 V536 H24 Z"/>
  <path class="card" d="M24 40 H314 L336 62 V536 H24 Z"/>
  <rect x="74" y="66" width="240" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <rect x="48" y="80" width="206" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <text x="48" y="112" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-weight="700"><tspan font-weight="700">Table 2.1:</tspan> Values for three groups.</text>
  <path class="ln thin" d="M106 124 H256 M106 146 H256 M106 190 H256"/>
  <text x="114" y="140" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">Group</text>
  <text class="end" x="248" y="140" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">Value</text>
  <text x="114" y="163" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">A</text>
  <text class="end" x="248" y="163" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">12</text>
  <text x="114" y="183" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">B</text>
  <text class="end" x="248" y="183" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">18</text>
  <rect x="74" y="214" width="240" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <rect x="48" y="228" width="226" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <rect class="ln thin" x="106" y="244" width="150" height="60" rx="2"/>
  <path class="ln thin sage" d="M120 294 L158 260 L184 282 L204 266 L242 294"/>
  <circle class="ln thin terra" cx="224" cy="258" r="6"/>
  <text x="48" y="326" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-weight="700"><tspan font-weight="700">Figure 2.1:</tspan> A sample image.</text>
  <rect x="74" y="352" width="240" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <rect x="48" y="366" width="196" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <text class="mid" x="181" y="402" style="font-size:16px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic">y = mx + b.</text>
  <path class="ln thin mut dot" d="M233 397 H268"/>
  <text class="end" x="314" y="402" style="font-size:15px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">(2.1)</text>
  <rect x="48" y="428" width="246" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <text class="end" x="143" y="460" style="font-size:16px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic">(a + b)²</text>
  <text x="151" y="460" style="font-size:16px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic">= (a + b)(a + b)</text>
  <text x="151" y="486" style="font-size:16px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic">= a² + 2ab + b².</text>
  <text class="end" x="314" y="478" style="font-size:15px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">(2.2)</text>
  <rect x="48" y="516" width="216" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <path class="ln" filter="url(#r)" d="M24 40 H314 L336 62 V536 H24 Z M314 40 V62 H336"/>
  <circle class="w-butter" cx="336" cy="107" r="10"/>
  <circle class="ln" filter="url(#r)" cx="336" cy="107" r="10"/>
  <text class="n mid" x="336" y="111.55" style="font-size:13px">1</text>
  <circle class="w-butter" cx="336" cy="321" r="10"/>
  <circle class="ln" filter="url(#r)" cx="336" cy="321" r="10"/>
  <text class="n mid" x="336" y="325.55" style="font-size:13px">2</text>
  <circle class="w-butter" cx="336" cy="397" r="10"/>
  <circle class="ln" filter="url(#r)" cx="336" cy="397" r="10"/>
  <text class="n mid" x="336" y="401.55" style="font-size:13px">3</text>
  <circle class="w-butter" cx="336" cy="473" r="10"/>
  <circle class="ln" filter="url(#r)" cx="336" cy="473" r="10"/>
  <text class="n mid" x="336" y="477.55" style="font-size:13px">4</text>
  <text class="hand" x="24" y="560" style="font-size:15px">in the list of figures:</text>
  <rect class="w-blue" x="29" y="575" width="312" height="64" rx="4"/>
  <rect class="card" x="24" y="570" width="312" height="64" rx="4"/>
  <rect class="ln" filter="url(#r)" x="24" y="570" width="312" height="64" rx="4"/>
  <text class="mid" x="180" y="594" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-weight="700">LIST OF FIGURES</text>
  <text x="38" y="618" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">2.1</text>
  <text x="70" y="618" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">A sample image.</text>
  <path class="ln thin mut dot" d="M180 615 H304"/>
  <text class="end" x="322" y="618" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">2</text>
  <circle class="w-butter" cx="336" cy="613" r="10"/>
  <circle class="ln" filter="url(#r)" cx="336" cy="613" r="10"/>
  <text class="n mid" x="336" y="617.55" style="font-size:13px">5</text>
  <path class="ln terra dash" filter="url(#r)" d="M22 320 C 4 386, 4 560, 18 606" marker-end="url(#at)"/>
  <circle class="w-butter" cx="34" cy="665" r="10"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="665" r="10"/>
  <text class="n mid" x="34" y="669.55" style="font-size:13px">1</text>
  <text class="hand" x="54" y="670" style="font-size:16px">caption above the table</text>
  <text class="s" x="54" y="690" style="font-size:14px">bold, colon after the number</text>
  <circle class="w-butter" cx="34" cy="715" r="10"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="715" r="10"/>
  <text class="n mid" x="34" y="719.55" style="font-size:13px">2</text>
  <text class="hand" x="54" y="720" style="font-size:16px">caption below the figure</text>
  <text class="s" x="54" y="740" style="font-size:14px">same bold label and colon</text>
  <circle class="w-butter" cx="34" cy="765" r="10"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="765" r="10"/>
  <text class="n mid" x="34" y="769.55" style="font-size:13px">3</text>
  <text class="hand" x="54" y="770" style="font-size:16px">number on the same line</text>
  <text class="s" x="54" y="790" style="font-size:14px">in parentheses, at the right margin</text>
  <circle class="w-butter" cx="34" cy="815" r="10"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="815" r="10"/>
  <text class="n mid" x="34" y="819.55" style="font-size:13px">4</text>
  <text class="hand" x="54" y="820" style="font-size:16px">one number, centered</text>
  <text class="s" x="54" y="840" style="font-size:14px">for a multi-line equation</text>
  <circle class="w-butter" cx="34" cy="865" r="10"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="865" r="10"/>
  <text class="n mid" x="34" y="869.55" style="font-size:13px">5</text>
  <text class="hand" x="54" y="870" style="font-size:16px">the list shows the full caption,</text>
  <text class="s" x="54" y="890" style="font-size:14px">word for word: don't use</text>
  <text class="code" x="54" y="912" style="font-size:14px"><tspan style="fill:var(--ink)">\caption[short]{…}</tspan></text>
</svg>
