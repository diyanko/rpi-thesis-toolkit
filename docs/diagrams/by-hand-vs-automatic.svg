  <rect class="ln thin terra" filter="url(#r)" x="35" y="344" width="15" height="15" rx="2"/>
  <text x="64" y="356" style="font-size:15px">Consistent heading and</text>
  <text x="64" y="375" style="font-size:15px">caption styles</text>
  <path class="ln thin mut dot" d="M34 386 H334"/>
  <rect class="ln thin terra" filter="url(#r)" x="35" y="396" width="15" height="15" rx="2"/>
  <text x="64" y="408" style="font-size:15px">Margins and page-number</text>
  <text x="64" y="427" style="font-size:15px">positions across sections</text>
  <rect class="w-sage" x="374" y="52" width="336" height="404" rx="12"/>
  <rect class="card" x="368" y="46" width="336" height="404" rx="12"/>
  <rect class="ln" filter="url(#r)" x="368" y="46" width="336" height="404" rx="12"/>
  <text class="h" x="390" y="78" style="font-size:19px">With this LaTeX starter</text>
  <text class="hand hs" x="390" y="102" style="font-size:16px">these update on every compile</text>
  <path class="ln thin mut" d="M368 116 H704"/>
  <path class="ln sage" d="M386 143 l5 6 l11 -13"/>
