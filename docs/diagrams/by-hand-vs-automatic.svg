  <rect class="w-terra" x="539" y="467" width="40" height="13" opacity=".9"/>
  <text class="s" x="466" y="494" style="font-size:14px">formatting set once in</text>
  <text class="m" x="466" y="514" style="font-size:14px">rpi-thesis.cls</text>
  </g>
  <path class="ln terra" filter="url(#r)" d="M672 474 C 700 462, 704 420, 692 390.0" marker-end="url(#at)"/>
  <text class="s" x="20" y="482" style="font-size:14px;font-style:italic">Word can automate some of this with styles and fields;</text>
  <text class="s" x="20" y="502" style="font-size:14px;font-style:italic">it takes care to keep it right across 150+ pages.</text>
