<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740" role="img" aria-labelledby="t d">
  <title id="t">From a drawn symbol to its LaTeX command</title>
  <desc id="d">You draw a symbol by hand, here a downward triangle, in Detexify. It returns the matching command, \nabla; check the package it lists, if any. Type it inside dollar signs in a sentence, $\nabla f = 0$. The PDF shows the symbol in the sentence: Set nabla f = 0 and solve.</desc>
  <style>
    svg { --bg: #faf5ea; --card: #fffcf5; --ink: #2d2620; --muted: #625547;
      --terra: #a24a24; --sage: #4a6b42; --plum: #70466a; --blue: #24518c; --red: #c8102e;
      --terra-w: #f6dfcd; --sage-w: #e4ecd2; --plum-w: #f1e0ea; --blue-w: #e0e6ef; --butter-w: #f7e8b3; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #181614; --card: #27231e; --ink: #f2ece2; --muted: #b9ae9d;
