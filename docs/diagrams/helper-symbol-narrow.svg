<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740" role="img" aria-labelledby="t d">
  <title id="t">From a drawn symbol to its LaTeX command</title>
  <desc id="d">You draw a symbol by hand, here a downward triangle, in Detexify. It returns the matching command, \nabla; check the package it lists, if any. Type it inside dollar signs in a sentence, $\nabla f = 0$. The PDF shows the symbol in the sentence: Set nabla f = 0 and solve.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="820">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rr" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="820">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="360" height="740" rx="18"/>
  <text x="24" y="30" style="font-size:15px;font-weight:700">You supply</text>
  <text class="s" x="24" y="49" style="font-size:13.5px">the symbol, drawn by hand</text>
  <rect class="w-butter" x="29" y="67" width="306" height="140" rx="4"/><rect class="card" x="24" y="62" width="306" height="140" rx="4"/><rect class="ln" filter="url(#r)" x="24" y="62" width="306" height="140" rx="4"/>
  <rect class="ln thin mut dash" x="119" y="78" width="116" height="108" rx="3"/>
  <path class="ln blue" style="stroke-width:3" filter="url(#rr)" d="M144 106 C167 103, 191 105, 211 104 C197 126, 185 146, 178 162 C167 144, 155 124, 146 108 M153 112 C162 128, 170 142, 176 154"/>
  <path class="ln terra" filter="url(#r)" d="M52 214 C46 227.6, 58 240.4, 52 262" marker-end="url(#at)"/>
  <text class="hand" x="76" y="243" style="font-size:15px">Detexify</text>
  <text x="24" y="292" style="font-size:15px;font-weight:700">LaTeX</text>
  <text class="s" x="24" y="311" style="font-size:13.5px">check the package it lists</text>
  <rect class="w-blue" x="29" y="329" width="306" height="132" rx="4"/><rect class="card" x="24" y="324" width="306" height="132" rx="4"/><rect class="ln" filter="url(#r)" x="24" y="324" width="306" height="132" rx="4"/>
  <text class="code mid" x="177" y="384" style="font-size:26px"><tspan class="k">\nabla</tspan></text>
  <path class="ln thin mut dot" d="M54 404 H300"/>
  <text class="code mid" x="177" y="434" style="font-size:15px" xml:space="preserve"><tspan style="fill:var(--ink)">$</tspan><tspan class="k">\nabla</tspan><tspan style="fill:var(--ink)"> f = 0$</tspan></text>
  <path class="ln terra" filter="url(#r)" d="M52 468 C46 481.6, 58 494.4, 52 516" marker-end="url(#at)"/>
  <text class="hand" x="76" y="488" style="font-size:15px">type it in</text>
  <text class="hand" x="76" y="506" style="font-size:15px">a sentence</text>
  <text x="24" y="546" style="font-size:15px;font-weight:700">Your PDF</text>
  <text class="s" x="24" y="565" style="font-size:13.5px">the symbol inside a sentence</text>
  <path class="w-sage" transform="translate(5 5)" d="M24 578 H312 L330 596 V718 H24 Z"/><path class="card" d="M24 578 H312 L330 596 V718 H24 Z"/><path class="ln" filter="url(#r)" d="M24 578 H312 L330 596 V718 H24 Z M312 578 V596 H330"/>
  <rect x="38" y="608" width="260" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <rect x="38" y="624" width="236" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <text class="mid" x="171" y="660" style="font-size:16px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">Set ∇<tspan font-style="italic">f</tspan> = 0 and solve.</text>
  <rect x="38" y="678" width="250" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <rect x="38" y="694" width="210" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
</svg>
