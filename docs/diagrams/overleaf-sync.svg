<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" role="img" aria-labelledby="t d">
  <title id="t">Moving a thesis between Overleaf and your computer</title>
  <desc id="d">Your computer's thesis folder on one side and an Overleaf project on the other, holding the same files: main.tex, chapters, figures, and references.bib. One arrow, from Overleaf to your computer, says Download source (ZIP). The other, from your computer to Overleaf, says Upload project (ZIP). The rule: one source of truth at a time; edit in one place, then move the whole project. A smaller note: on some plans, Overleaf's Git or GitHub sync can keep them in step.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="504">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="720" height="424" rx="18"/>
  <text class="hand hs mid" x="140" y="40" style="font-size:19px">your computer</text>
  <text class="hand hb mid" x="580" y="40" style="font-size:19px">Overleaf</text>
  <path class="w-sage" transform="translate(7 7)" d="M30 58 V236 H250 V72 H122 L110 58 Z"/>
  <path class="card" d="M30 58 V236 H250 V72 H122 L110 58 Z"/>
  <path class="ln" filter="url(#r)" d="M30 58 V236 H250 V72 H122 L110 58 Z"/>
  <text x="48" y="100" style="font-size:17px" font-weight="700">thesis folder</text>
  <text class="code" x="48" y="130" style="font-size:15px">main.tex</text>
  <text class="code" x="48" y="152" style="font-size:15px">chapters/</text>
  <text class="code" x="48" y="174" style="font-size:15px">figures/</text>
  <text class="code" x="48" y="196" style="font-size:15px">references.bib</text>
  <rect class="w-blue" x="477" y="65" width="220" height="178" rx="12"/>
  <rect class="card" x="470" y="58" width="220" height="178" rx="12"/>
  <rect class="ln" filter="url(#r)" x="470" y="58" width="220" height="178" rx="12"/>
  <path class="ln thin" d="M470 82 H690"/>
  <rect class="ln thin mut" x="510" y="65" width="140" height="10" rx="5"/>
  <text x="488" y="110" style="font-size:17px" font-weight="700">Overleaf project</text>
  <text class="code" x="488" y="130" style="font-size:15px">main.tex</text>
  <text class="code" x="488" y="152" style="font-size:15px">chapters/</text>
  <text class="code" x="488" y="174" style="font-size:15px">figures/</text>
  <text class="code" x="488" y="196" style="font-size:15px">references.bib</text>
  <path class="ln blue" filter="url(#r)" d="M462 112 C 400 86, 320 86, 262 112" marker-end="url(#ab)"/>
  <text class="mid" x="362" y="74" style="font-size:17px" font-weight="700">Download source (ZIP)</text>
  <path class="ln sage" filter="url(#r)" d="M262 196 C 320 222, 400 222, 462 196" marker-end="url(#as)"/>
  <text class="mid" x="362" y="246" style="font-size:17px" font-weight="700">Upload project (ZIP)</text>
  <path class="w-butter" d="M344 128 H370 L380 138 V176 H344 Z"/>
  <path class="ln" filter="url(#r)" d="M344 128 H370 L380 138 V176 H344 Z"/>
  <path class="ln thin dash" d="M358 130 V150"/>
  <text class="mid" x="362" y="169" style="font-size:13px" font-weight="700">ZIP</text>
  <g transform="rotate(-1 360 318)">
  <rect class="w-butter" x="112" y="286" width="496" height="64" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="112" y="286" width="496" height="64" rx="3"/>
  <rect class="w-terra" x="340" y="279" width="40" height="13" opacity=".9"/>
  <text class="mid" x="360" y="312" style="font-size:17px" font-weight="700">One source of truth at a time:</text>
  <text class="mid" x="360" y="336" style="font-size:16px">edit in one place, then move the whole project</text>
  </g>
  <rect class="ln thin mut dash" x="120" y="370" width="480" height="38" rx="12"/>
  <text class="s mid" x="360" y="395" style="font-size:14.5px">On some plans, Overleaf's Git or GitHub sync can keep them in step</text>
</svg>
