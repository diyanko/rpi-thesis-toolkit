<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 776" width="360" height="776" role="img" aria-labelledby="t d">
  <title id="t">How a citation travels</title>
  <desc id="d">How a citation travels. A source's details go into references.bib, either pasted by hand or exported from a citation manager such as Zotero. In a chapter you write \cite with the source's key. When you compile, Biber matches the key to the entry and formats it in your chosen style. The PDF shows the in-text citation and the entry in the reference list.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="856">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="360" height="776" rx="18"/>
  <rect class="w-butter" x="22" y="24" width="152" height="60" rx="12"/>
  <rect class="ln" filter="url(#r)" x="16" y="18" width="152" height="60" rx="12"/>
  <text class="mid" x="92" y="43" style="font-size:16px">pasted</text>
  <text class="s mid" x="92" y="65" style="font-size:14px">by hand</text>
  <rect class="w-sage" x="192" y="24" width="156" height="60" rx="12"/>
  <rect class="ln" filter="url(#r)" x="186" y="18" width="156" height="60" rx="12"/>
  <text class="mid" x="264" y="43" style="font-size:15px">exported from</text>
  <text class="s mid" x="264" y="65" style="font-size:13.5px">Zotero or similar</text>
  <path class="ln" filter="url(#r)" d="M92 86 C 96 96, 104 102, 114 110" marker-end="url(#a)"/>
  <path class="ln" filter="url(#r)" d="M264 86 C 260 96, 252 102, 242 110" marker-end="url(#a)"/>
  <path class="w-plum" d="M24 122 H308 L324 138 V254 H24 Z"/>
  <path class="card" d="M18 116 H302 L318 132 V248 H18 Z"/>
  <path class="ln" filter="url(#r)" d="M18 116 H302 L318 132 V248 H18 Z M302 116 V132 H318"/>
  <text class="m" x="34" y="144" style="font-size:15px">references.bib</text>
  <text class="code" x="34" y="172" style="font-size:13.5px">@book{<tspan class="k">lamport1994</tspan>,</text>
  <text class="code" x="34" y="194" style="font-size:13.5px" xml:space="preserve">  author = {Leslie Lamport},</text>
  <text class="code" x="34" y="216" style="font-size:13.5px" xml:space="preserve">  title  = {LaTeX: …},</text>
  <text class="code" x="34" y="238" style="font-size:13.5px" xml:space="preserve">  …}</text>
  <path class="ln terra dash" filter="url(#r)" d="M84 258 C 80 274, 88 288, 84 304" marker-start="url(#at)" marker-end="url(#at)"/>
  <text class="hand" x="104" y="287" style="font-size:17px">the keys must match</text>
  <path class="w-blue" d="M24 320 H308 L324 336 V422 H24 Z"/>
  <path class="card" d="M18 314 H302 L318 330 V416 H18 Z"/>
  <path class="ln" filter="url(#r)" d="M18 314 H302 L318 330 V416 H18 Z M302 314 V330 H318"/>
  <text class="m" x="34" y="340" style="font-size:13.5px">chapters/01-introduction.tex</text>
  <text class="code" x="34" y="368" style="font-size:13.5px">…as in this example</text>
  <text class="code" x="34" y="392" style="font-size:13.5px">~\cite{<tspan class="k">lamport1994</tspan>}.</text>
  <text class="hand hb" x="20" y="452" style="font-size:16px">you write \cite{key}</text>
  <text class="hand hb" x="20" y="472" style="font-size:16px">in a chapter</text>
  <path class="ln blue" filter="url(#r)" d="M160 446 C 164 438, 168 432, 172 424" marker-end="url(#ab)"/>
  <path class="ln" filter="url(#r)" d="M324 170 C 352 220, 352 440, 292 520" marker-end="url(#a)"/>
  <path class="ln" filter="url(#r)" d="M190 424 C 186 440, 194 456, 190 476" marker-end="url(#a)"/>
  <text class="hand" x="202" y="456" style="font-size:16px">when you compile</text>
  <rect class="w-plum" x="110" y="488" width="180" height="84" rx="16"/>
  <rect class="ln" filter="url(#r)" x="104" y="482" width="180" height="84" rx="16"/>
  <text class="h mid" x="194" y="510" style="font-size:20px">Biber</text>
  <text class="s mid" x="194" y="533" style="font-size:14px">matches keys,</text>
  <text class="s mid" x="194" y="552" style="font-size:14px">in your style</text>
  <path class="ln" filter="url(#r)" d="M194 572 C 190 582, 198 590, 194 600" marker-end="url(#a)"/>
  <path class="w-sage" d="M110 610 H266 L282 626 V758 H110 Z"/>
  <path class="card" d="M104 604 H260 L276 620 V752 H104 Z"/>
  <path class="ln" filter="url(#r)" d="M104 604 H260 L276 620 V752 H104 Z M260 604 V620 H276"/>
  <path class="ln thin sage" filter="url(#r)" d="M118 630 H262 M118 646 H240"/>
  <text x="118" y="674" style="font-size:15px">this work <tspan class="k">[1]</tspan>.</text>
  <text x="118" y="702" style="font-size:15px" font-weight="700">References</text>
  <text x="118" y="724" style="font-size:14px"><tspan class="k">[1]</tspan> L. Lamport,</text>
  <text class="s" x="118" y="744" style="font-size:14px" font-style="italic">LaTeX: A Doc…</text>
  <text class="hand" x="290" y="690" style="font-size:17px">in your</text>
  <text class="hand" x="290" y="710" style="font-size:17px">PDF</text>
</svg>
