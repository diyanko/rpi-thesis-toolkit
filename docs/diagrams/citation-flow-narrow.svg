<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1134" width="360" height="1134" role="img" aria-labelledby="t d">
  <title id="t">How a citation travels</title>
  <desc id="d">How a citation travels, and three things that are not the same. The record: a source saved in a citation manager such as Zotero, with its author, title, and year. The citation key: a short, stable name for that source, here lamport1994, pinned with Better BibTeX and exported with the entry into references.bib; you can also paste an entry into references.bib by hand. In a chapter you write only the key, as \cite{lamport1994}; the keys must match. When you compile, Biber matches the key and formats the citation in your chosen style: [1] in the text, and the full entry under REFERENCES in your PDF. The record, the key, and the formatted citation are different things, and only the key goes in your chapter.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="1214">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="360" height="1134" rx="18"/>
  <text class="hand hs mid" x="118" y="30" style="font-size:17px">the record, in Zotero</text>
  <rect class="w-sage" x="24" y="50" width="196" height="168" rx="14"/>
  <rect class="card" x="18" y="44" width="196" height="168" rx="14"/>
  <rect class="ln" filter="url(#r)" x="18" y="44" width="196" height="168" rx="14"/>
  <text class="s" x="32" y="76" style="font-size:14px">Author</text>
  <text x="84" y="76" style="font-size:15px">Leslie Lamport</text>
  <text class="s" x="32" y="101" style="font-size:14px">Title</text>
  <text x="84" y="101" style="font-size:15px">LaTeX: A Doc…</text>
  <text class="s" x="32" y="126" style="font-size:14px">Year</text>
  <text x="84" y="126" style="font-size:15px">1994</text>
  <path class="ln thin mut dot" d="M30 146 H202"/>
  <text class="s" x="32" y="170" style="font-size:14px">Citation Key</text>
  <text class="m" x="32" y="194" style="font-size:15.5px"><tspan class="k">lamport1994</tspan></text>
  <text class="hand" x="232" y="168" style="font-size:15.5px">key pinned</text>
  <text class="hand" x="232" y="187" style="font-size:15.5px">with Better</text>
  <text class="hand" x="232" y="206" style="font-size:15.5px">BibTeX</text>
  <path class="ln" filter="url(#r)" d="M100 222 C 94 238, 106 252, 100 268" marker-end="url(#a)"/>
  <text class="hand" x="114" y="252" style="font-size:16px">export</text>
  <rect class="w-butter" x="192" y="234" width="156" height="56" rx="12"/>
  <rect class="ln" filter="url(#r)" x="186" y="228" width="156" height="56" rx="12"/>
  <text class="mid" x="264" y="254" style="font-size:15.5px">or paste an entry</text>
  <text class="s mid" x="264" y="275" style="font-size:15px">by hand</text>
  <path class="ln" filter="url(#r)" d="M262 290 C 258 296, 254 300, 250 304" marker-end="url(#a)"/>
  <path class="w-plum" transform="translate(6 6)" d="M18 310 H302 L318 326 V460 H18 Z"/>
  <path class="card" d="M18 310 H302 L318 326 V460 H18 Z"/>
  <path class="ln" filter="url(#r)" d="M18 310 H302 L318 326 V460 H18 Z M302 310 V326 H318"/>
  <text class="m" x="34" y="340" style="font-size:16.5px">references.bib</text>
  <text class="code" x="34" y="368.6" style="font-size:14px">@book{<tspan class="k">lamport1994</tspan>,</text>
  <text class="code" x="34" y="390.6" style="font-size:14px" xml:space="preserve">  author = {Leslie Lamport},</text>
  <text class="code" x="34" y="412.6" style="font-size:14px" xml:space="preserve">  title  = {LaTeX: …},</text>
  <text class="code" x="34" y="434.6" style="font-size:14px" xml:space="preserve">  …}</text>
  <path class="ln terra dash" filter="url(#r)" d="M84 472 C 80 486, 88 500, 84 516" marker-start="url(#at)" marker-end="url(#at)"/>
  <text class="hand" x="104" y="500" style="font-size:17px">the keys must match</text>
  <path class="w-blue" transform="translate(6 6)" d="M18 526 H302 L318 542 V626 H18 Z"/>
  <path class="card" d="M18 526 H302 L318 542 V626 H18 Z"/>
  <path class="ln" filter="url(#r)" d="M18 526 H302 L318 542 V626 H18 Z M302 526 V542 H318"/>
  <text class="m" x="34" y="554" style="font-size:14px">chapters/01-introduction.tex</text>
  <text class="code" x="34" y="584" style="font-size:14px">…as in this example</text>
  <text class="code" x="34" y="610" style="font-size:14px">~\cite{<tspan class="k">lamport1994</tspan>}.</text>
  <text class="hand hb" x="20" y="656" style="font-size:17px">you write only the key</text>
  <path class="ln" filter="url(#r)" d="M232 636 C 228 652, 236 664, 232 680" marker-end="url(#a)"/>
  <text class="hand" x="244" y="660" style="font-size:16px">compile</text>
  <path class="ln" filter="url(#r)" d="M330 360 C 356 420, 356 640, 276 704" marker-end="url(#a)"/>
  <rect class="w-plum" x="104" y="692" width="172" height="92" rx="16"/>
  <rect class="ln" filter="url(#r)" x="98" y="686" width="172" height="92" rx="16"/>
  <text class="h mid" x="184" y="720" style="font-size:21px">Biber</text>
  <text class="s mid" x="184" y="744" style="font-size:15px">matches the key,</text>
  <text class="s mid" x="184" y="764" style="font-size:15px">formats your style</text>
  <path class="ln" filter="url(#r)" d="M184 784 C 180 796, 188 804, 184 814" marker-end="url(#a)"/>
  <path class="w-sage" transform="translate(6 6)" d="M104 820 H248 L264 836 V988 H104 Z"/>
  <path class="card" d="M104 820 H248 L264 836 V988 H104 Z"/>
  <path class="ln" filter="url(#r)" d="M104 820 H248 L264 836 V988 H104 Z M248 820 V836 H264"/>
  <path class="ln thin sage" filter="url(#r)" d="M118 848 H246 M118 864 H228"/>
  <text x="118" y="892" style="font-size:15.5px">this work <tspan class="k">[1]</tspan>.</text>
  <text class="mid" x="184" y="928" style="font-size:14px" font-weight="700">REFERENCES</text>
  <text x="118" y="952" style="font-size:14.5px"><tspan class="k">[1]</tspan> L. Lamport,</text>
  <text class="s" x="118" y="973" style="font-size:14.5px" font-style="italic">LaTeX: A Doc…</text>
  <text class="hand mid" x="180" y="1010" style="font-size:16px">the formatted citation, in your PDF</text>
  <g transform="rotate(-1 180 1074)">
  <rect class="w-butter" x="22" y="1030" width="316" height="88" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="22" y="1030" width="316" height="88" rx="3"/>
  <rect class="w-terra" x="160" y="1023" width="40" height="13" opacity=".9"/>
  <text class="mid" x="180" y="1058" style="font-size:15.5px" font-weight="700">Record, key, formatted citation:</text>
  <text class="mid" x="180" y="1080" style="font-size:15.5px">three different things.</text>
  <text class="mid" x="180" y="1102" style="font-size:15.5px">Only the key goes in your chapter.</text>
  </g>
</svg>
