<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 608" width="360" height="608" role="img" aria-labelledby="t d">
  <title id="t">Word and this LaTeX starter: keeping a thesis consistent</title>
  <desc id="d">Both Word and LaTeX can automate numbering and references when set up correctly. Word uses heading styles, multilevel lists, captions, cross-references, paste options, and contents fields. This starter uses include lines, section commands, captions, labels, references, and compiling. In either workflow, check numbering, formatting, placement, and the final PDF.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45; --blue: #2b4d7a; --sage: #46684b; --terra: #9e4526; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8; --blue: #a3c0ea; --sage: #a9c9a1; --terra: #eda482; }
    }
    .bg { fill: var(--bg); } .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .rule { fill: none; stroke: var(--muted); stroke-width: 1; stroke-dasharray: 1 6; stroke-linecap: round; opacity: .6; }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 15px; }
    .heading { font-weight: 700; font-size: 22px; } .task { font-weight: 700; }
    .word { fill: var(--blue); } .latex { fill: var(--sage); }
    .note { fill: var(--muted); font-size: 15px; }
    .hand { fill: var(--terra); font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-style: italic; font-size: 18px; }
  </style>
  <rect class="bg" width="360" height="608" rx="18"/>
  <text x="20" y="27" class="hand">Keeping a long thesis consistent</text>
  <rect class="card" x="12" y="48" width="336" height="114" rx="10"/>
  <path class="ln" d="M23 48.4 Q156 46.9 337 48.6 Q348.7 48.5 348 60 Q347.2 103 348.5 151 Q348.2 162.8 336 162 Q169 163.2 23 161.6 Q11.1 162.5 12 150 Q12.8 98 11.7 60 Q11.3 47.7 23 48.4 Z"/>
  <text x="26" y="70" class="task" style="font-size:15.5px">Move a chapter or section</text>
  <text x="26" y="92" class="task word" style="font-size:14px">Word</text>
  <text x="80" y="92" style="font-size:15.5px">Heading styles + multilevel list;</text>
  <text x="80" y="110" style="font-size:15.5px">check numbering after the move.</text>
  <text x="26" y="132" class="task latex" style="font-size:14px">LaTeX</text>
  <text x="80" y="132" style="font-size:15.5px">Move include line or section;</text>
  <text x="80" y="150" style="font-size:15.5px">compile, then check references.</text>
  <rect class="card" x="12" y="172" width="336" height="114" rx="10"/>
  <path class="ln" d="M23 172.4 Q156 170.9 337 172.6 Q348.7 172.5 348 184 Q347.2 227 348.5 275 Q348.2 286.8 336 286 Q169 287.2 23 285.6 Q11.1 286.5 12 274 Q12.8 222 11.7 184 Q11.3 171.7 23 172.4 Z"/>
  <text x="26" y="194" class="task" style="font-size:15.5px">Add or move a figure</text>
  <text x="26" y="216" class="task word" style="font-size:14px">Word</text>
  <text x="80" y="216" style="font-size:15.5px">Insert caption + cross-reference;</text>
  <text x="80" y="234" style="font-size:15.5px">update fields after editing.</text>
  <text x="26" y="256" class="task latex" style="font-size:14px">LaTeX</text>
  <text x="80" y="256" style="font-size:15.5px">Add caption + label/ref; compile</text>
  <text x="80" y="274" style="font-size:15.5px">and check the figure placement.</text>
  <rect class="card" x="12" y="296" width="336" height="114" rx="10"/>
  <path class="ln" d="M23 296.4 Q156 294.9 337 296.6 Q348.7 296.5 348 308 Q347.2 351 348.5 399 Q348.2 410.8 336 410 Q169 411.2 23 409.6 Q11.1 410.5 12 398 Q12.8 346 11.7 308 Q11.3 295.7 23 296.4 Z"/>
  <text x="26" y="318" class="task" style="font-size:15.5px">Paste text from elsewhere</text>
  <text x="26" y="340" class="task word" style="font-size:14px">Word</text>
  <text x="80" y="340" style="font-size:15.5px">Choose the paste formatting;</text>
  <text x="80" y="358" style="font-size:15.5px">check styles in the pasted text.</text>
  <text x="26" y="380" class="task latex" style="font-size:14px">LaTeX</text>
  <text x="80" y="380" style="font-size:15.5px">Paste plain text + markup;</text>
  <text x="80" y="398" style="font-size:15.5px">check any imported commands.</text>
  <rect class="card" x="12" y="420" width="336" height="114" rx="10"/>
  <path class="ln" d="M23 420.4 Q156 418.9 337 420.6 Q348.7 420.5 348 432 Q347.2 475 348.5 523 Q348.2 534.8 336 534 Q169 535.2 23 533.6 Q11.1 534.5 12 522 Q12.8 470 11.7 432 Q11.3 419.7 23 420.4 Z"/>
  <text x="26" y="442" class="task" style="font-size:15.5px">Refresh the contents</text>
  <text x="26" y="464" class="task word" style="font-size:14px">Word</text>
  <text x="80" y="464" style="font-size:15.5px">Update the entire contents</text>
  <text x="80" y="482" style="font-size:15.5px">to include added sections.</text>
  <text x="26" y="504" class="task latex" style="font-size:14px">LaTeX</text>
  <text x="80" y="504" style="font-size:15.5px">Compile; review the contents</text>
  <text x="80" y="522" style="font-size:15.5px">and links after edits.</text>
  <text x="20" y="567" class="note" style="font-size:14.5px">Both automate when set up well.</text>
  <text x="20" y="588" class="note" style="font-size:14.5px">Check the final PDF in either workflow.</text>
</svg>
