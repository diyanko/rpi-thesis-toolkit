<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 862" width="360" height="862" role="img" aria-labelledby="t d">
  <title id="t">From a rough sketch to a figure in your thesis</title>
  <desc id="d">You supply a rough sketch: three boxes, Collect, Analyze, and Report, joined by arrows. Redraw it in draw.io, save the .drawio file, and export a PDF. The clean version has tidy boxes and straight arrows; keep labels readable at final size. Add the PDF like any figure. The thesis page shows the diagram with its caption below it, in bold: Figure 2.3: Example workflow.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="942">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rr" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="942">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="360" height="862" rx="18"/>
  <text x="24" y="30" style="font-size:15px;font-weight:700">You supply</text>
  <text class="s" x="24" y="49" style="font-size:13.5px">a rough sketch</text>
  <rect class="w-butter" x="29" y="67" width="306" height="172" rx="4"/><rect class="card" x="24" y="62" width="306" height="172" rx="4"/><rect class="ln" filter="url(#r)" x="24" y="62" width="306" height="172" rx="4"/>
  <g filter="url(#rr)"><rect class="ln blue" x="123" y="85" width="92" height="30" rx="3"/><text class="hand mid" x="169" y="105" style="font-size:16px;fill:var(--blue)">Collect</text><path class="ln blue" d="M174 117 C180 123, 169 127, 175 130 M169 124 L175 130 L180 123"/><rect class="ln blue" x="133" y="133" width="92" height="30" rx="3"/><text class="hand mid" x="179" y="153" style="font-size:16px;fill:var(--blue)">Analyze</text><path class="ln blue" d="M175 165 C181 171, 170 175, 176 178 M170 172 L176 178 L181 171"/><rect class="ln blue" x="125" y="181" width="92" height="30" rx="3"/><text class="hand mid" x="171" y="201" style="font-size:16px;fill:var(--blue)">Report</text></g>
  <path class="ln terra" filter="url(#r)" d="M52 246 C46 259.6, 58 272.4, 52 294" marker-end="url(#at)"/>
  <text class="hand" x="76" y="266" style="font-size:15px">draw.io: save .drawio,</text>
  <text class="hand" x="76" y="284" style="font-size:15px">export PDF</text>
  <text x="24" y="324" style="font-size:15px;font-weight:700">Clean diagram</text>
  <text class="s" x="24" y="343" style="font-size:13.5px">keep labels readable at final size</text>
  <rect class="w-blue" x="29" y="361" width="306" height="172" rx="4"/><rect class="card" x="24" y="356" width="306" height="172" rx="4"/><rect class="ln" filter="url(#r)" x="24" y="356" width="306" height="172" rx="4"/>
  <rect class="w-blue" x="127" y="379" width="100" height="30" rx="5"/>
  <rect class="ln thin blue" x="127" y="379" width="100" height="30" rx="5"/>
  <text class="mid" x="177" y="399.2" style="font-size:15px;font-weight:600">Collect</text>
  <path class="ln thin" d="M177 412 V423" marker-end="url(#a)"/>
  <rect class="w-blue" x="127" y="427" width="100" height="30" rx="5"/>
  <rect class="ln thin blue" x="127" y="427" width="100" height="30" rx="5"/>
  <text class="mid" x="177" y="447.2" style="font-size:15px;font-weight:600">Analyze</text>
  <path class="ln thin" d="M177 460 V471" marker-end="url(#a)"/>
  <rect class="w-blue" x="127" y="475" width="100" height="30" rx="5"/>
  <rect class="ln thin blue" x="127" y="475" width="100" height="30" rx="5"/>
  <text class="mid" x="177" y="495.2" style="font-size:15px;font-weight:600">Report</text>
  <path class="ln terra" filter="url(#r)" d="M52 540 C46 553.6, 58 566.4, 52 588" marker-end="url(#at)"/>
  <text class="hand" x="76" y="560" style="font-size:15px">add it like</text>
  <text class="hand" x="76" y="578" style="font-size:15px">any figure</text>
  <text x="24" y="618" style="font-size:15px;font-weight:700">Your PDF</text>
  <text class="s" x="24" y="637" style="font-size:13.5px">caption below, in bold</text>
  <path class="w-sage" transform="translate(5 5)" d="M24 650 H312 L330 668 V840 H24 Z"/><path class="card" d="M24 650 H312 L330 668 V840 H24 Z"/><path class="ln" filter="url(#r)" d="M24 650 H312 L330 668 V840 H24 Z M312 650 V668 H330"/>
  <rect x="38" y="672" width="260" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <rect class="w-blue" x="142" y="686" width="70" height="21" rx="5"/>
  <rect class="ln thin blue" x="142" y="686" width="70" height="21" rx="5"/>
  <text class="mid" x="177" y="701" style="font-size:13px;font-weight:600">Collect</text>
  <path class="ln thin" d="M177 710 V720" marker-end="url(#a)"/>
  <rect class="w-blue" x="142" y="724" width="70" height="21" rx="5"/>
  <rect class="ln thin blue" x="142" y="724" width="70" height="21" rx="5"/>
  <text class="mid" x="177" y="739" style="font-size:13px;font-weight:600">Analyze</text>
  <path class="ln thin" d="M177 748 V758" marker-end="url(#a)"/>
  <rect class="w-blue" x="142" y="762" width="70" height="21" rx="5"/>
  <rect class="ln thin blue" x="142" y="762" width="70" height="21" rx="5"/>
  <text class="mid" x="177" y="777" style="font-size:13px;font-weight:600">Report</text>
  <text x="38" y="807" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-weight="700">Figure 2.3: Example workflow.</text>
  <rect x="38" y="822" width="246" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
</svg>
