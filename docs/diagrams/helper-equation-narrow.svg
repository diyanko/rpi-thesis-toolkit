<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 760" width="360" height="760" role="img" aria-labelledby="t d">
  <title id="t">From a handwritten equation to a numbered one</title>
  <desc id="d">Illustrative example. You supply an equation written by hand or clicked together in an equation editor: x equals minus b plus or minus the square root of b squared minus 4ac, all over 2a. An equation editor, or an AI assistant that accepts images, gives LaTeX that goes between \begin{equation} and \end{equation}, with no dollar signs inside: x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}. Paste it into your chapter. The PDF shows the typeset fraction with its number, (2.3), at the right margin.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="840">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rr" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="840">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="360" height="760" rx="18"/>
  <text x="24" y="30" style="font-size:15px;font-weight:700">You supply</text>
  <text class="s" x="24" y="49" style="font-size:13.5px">handwritten or clicked together</text>
  <rect class="w-butter" x="29" y="67" width="306" height="134" rx="4"/><rect class="card" x="24" y="62" width="306" height="134" rx="4"/><rect class="ln" filter="url(#r)" x="24" y="62" width="306" height="134" rx="4"/>
  <path class="ln thin blue" style="opacity:.25;stroke-width:1" d="M34 92 H320"/>
  <path class="ln thin blue" style="opacity:.25;stroke-width:1" d="M34 124 H320"/>
  <path class="ln thin blue" style="opacity:.25;stroke-width:1" d="M34 156 H320"/>
  <g filter="url(#rr)"><g transform="translate(177 127) scale(1.12) translate(-177 -127)"><text class="hand" x="90" y="136" style="font-size:20px;fill:var(--blue)">x =</text><text class="hand" x="134" y="121" style="font-size:20px;fill:var(--blue)">−b ±</text><path class="ln blue" d="M183 115 L188 120 L194 126 L201 97 H264"/><text class="hand" x="203" y="121" style="font-size:20px;fill:var(--blue)">b²−4ac</text><path class="ln blue" d="M130 131 C170 129, 220 133, 266 130"/><text class="hand" x="188" y="155" style="font-size:20px;fill:var(--blue)">2a</text></g></g>
  <path class="ln terra" filter="url(#r)" d="M52 208 C46 228, 58 244, 52 272" marker-end="url(#at)"/>
  <text class="hand" x="76" y="227" style="font-size:15px">equation editor, or an AI</text>
  <text class="hand" x="76" y="245" style="font-size:15px">assistant that accepts images</text>
  <text class="hand" x="76" y="262" style="font-size:13px;fill:var(--muted)">illustrative example</text>
  <text x="24" y="302" style="font-size:15px;font-weight:700">LaTeX</text>
  <text class="s" x="24" y="321" style="font-size:13.5px">no $ signs inside equation</text>
  <rect class="w-blue" x="29" y="339" width="306" height="132" rx="4"/><rect class="card" x="24" y="334" width="306" height="132" rx="4"/><rect class="ln" filter="url(#r)" x="24" y="334" width="306" height="132" rx="4"/>
  <rect class="w-butter" x="30" y="355" width="294" height="21" opacity=".8"/>
  <rect class="w-butter" x="30" y="421" width="294" height="21" opacity=".8"/>
  <text class="code" x="87" y="370" style="font-size:14px" xml:space="preserve"><tspan style="fill:var(--plum)" font-weight="700">\begin{equation}</tspan></text>
  <text class="code" x="87" y="392" style="font-size:14px" xml:space="preserve"><tspan style="fill:var(--ink)">  x = </tspan><tspan class="k">\frac</tspan><tspan style="fill:var(--ink)">{-b </tspan><tspan class="k">\pm</tspan></text>
  <text class="code" x="87" y="414" style="font-size:14px" xml:space="preserve"><tspan style="fill:var(--ink)">    </tspan><tspan class="k">\sqrt</tspan><tspan style="fill:var(--ink)">{b^2-4ac}}{2a}</tspan></text>
  <text class="code" x="87" y="436" style="font-size:14px" xml:space="preserve"><tspan style="fill:var(--plum)" font-weight="700">\end{equation}</tspan></text>
  <path class="ln terra" filter="url(#r)" d="M52 478 C46 491.6, 58 504.4, 52 526" marker-end="url(#at)"/>
  <text class="hand" x="76" y="498" style="font-size:15px">paste into</text>
  <text class="hand" x="76" y="516" style="font-size:15px">your chapter</text>
  <text x="24" y="556" style="font-size:15px;font-weight:700">Your PDF</text>
  <text class="s" x="24" y="575" style="font-size:13.5px">number at the right margin</text>
  <path class="w-sage" transform="translate(5 5)" d="M24 588 H312 L330 606 V738 H24 Z"/><path class="card" d="M24 588 H312 L330 606 V738 H24 Z"/><path class="ln" filter="url(#r)" d="M24 588 H312 L330 606 V738 H24 Z M312 588 V606 H330"/>
  <rect x="38" y="614" width="260" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <rect x="38" y="628" width="226" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <text x="94.5" y="676" style="font-size:15px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic">x</text>
  <text x="106.5" y="676" style="font-size:15px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">=</text>
  <text x="127.5" y="663" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">−<tspan font-style="italic">b</tspan> ±</text>
  <path class="ln" style="stroke-width:1.1" d="M163.5 657 L166.5 655 L170.5 665 L175.5 645 H234.5"/>
  <text x="177.5" y="663" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"><tspan font-style="italic">b</tspan>² − 4<tspan font-style="italic">ac</tspan></text>
  <path class="ln" style="stroke-width:1.1" d="M125.5 671 H236.5"/>
  <text class="mid" x="180.5" y="688" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">2<tspan font-style="italic">a</tspan></text>
  <text class="end" x="316" y="676" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">(2.3)</text>
  <rect x="38" y="704" width="266" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <rect x="38" y="718" width="216" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
</svg>
