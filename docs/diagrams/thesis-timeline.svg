  <text class="mid" x="360" y="269" style="font-size:15.5px" font-weight="700">with your advisor</text>
  <g transform="rotate(-2 360 303)">
  <rect class="w-butter" x="308.2" y="287" width="103.6" height="32" rx="3"/>
