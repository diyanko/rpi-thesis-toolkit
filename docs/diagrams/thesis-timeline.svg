  <rect class="ln thin" filter="url(#r)" x="568" y="405" width="116" height="32" rx="3"/>
  <rect class="w-plum" x="606" y="398" width="40" height="13" opacity=".9"/>
  <text class="mid" x="626" y="426" style="font-size:15px">How do I…?</text>
