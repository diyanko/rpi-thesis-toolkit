  <rect class="ln thin" filter="url(#r)" x="218.2" y="114" width="103.6" height="32" rx="3"/>
  <rect class="w-terra" x="250" y="107" width="40" height="13" opacity=".9"/>
  <text class="mid" x="270" y="135" style="font-size:15px">Citations</text>
  </g>
  <g transform="rotate(2 270 80)">
  <rect class="w-butter" x="197.2" y="64" width="145.6" height="32" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="197.2" y="64" width="145.6" height="32" rx="3"/>
