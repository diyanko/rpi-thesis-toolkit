  </g>
  <circle class="w-butter" cx="450" cy="206" r="17"/>
  <circle class="ln" filter="url(#r)" cx="450" cy="206" r="17"/>
  <text class="n mid" x="450" y="212.3" style="font-size:18px">5</text>
  <text class="hand mid" x="450" y="174" style="font-size:15px">before you defend</text>
  <text class="mid" x="450" y="154" style="font-size:15.5px" font-weight="700">formatting review</text>
  <text class="mid" x="450" y="135" style="font-size:15.5px" font-weight="700">Preliminary</text>
  <g transform="rotate(-1 450 91)">
  <rect class="w-butter" x="394" y="75" width="112" height="32" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="394" y="75" width="112" height="32" rx="3"/>
  <rect class="w-terra" x="430" y="68" width="40" height="13" opacity=".9"/>
  <text class="mid" x="450" y="96" style="font-size:15px">Submitting</text>
  </g>
  <circle class="w-terra" cx="540" cy="206" r="17"/>
  <circle class="ln" filter="url(#r)" cx="540" cy="206" r="17"/>
  <text class="n mid" x="540" y="212.3" style="font-size:18px">6</text>
  <text class="mid" x="540" y="250" style="font-size:15.5px" font-weight="700">Defend</text>
  <circle class="w-butter" cx="630" cy="206" r="17"/>
  <circle class="ln" filter="url(#r)" cx="630" cy="206" r="17"/>
  <text class="n mid" x="630" y="212.3" style="font-size:18px">7</text>
  <text class="mid" x="630" y="174" style="font-size:15.5px" font-weight="700">Submit</text>
  <g transform="rotate(-2 630 130)">
  <rect class="w-butter" x="574" y="114" width="112" height="32" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="574" y="114" width="112" height="32" rx="3"/>
  <rect class="w-terra" x="610" y="107" width="40" height="13" opacity=".9"/>
  <text class="mid" x="630" y="135" style="font-size:15px">Submitting</text>
  </g>
  <rect class="w-plum" x="22" y="396" width="682" height="62" rx="14"/>
  <rect class="ln plum dash" filter="url(#r)" x="16" y="390" width="682" height="62" rx="14"/>
  <text class="hand hp" x="40" y="427" style="font-size:18px">any time you're stuck, at every stage</text>
  <g transform="rotate(-1.5 462 421)">
  <rect class="w-butter" x="370" y="405" width="184" height="32" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="370" y="405" width="184" height="32" rx="3"/>
  <rect class="w-plum" x="442" y="398" width="40" height="13" opacity=".9"/>
  <text class="mid" x="462" y="426" style="font-size:15px">Fixing problems</text>
  </g>
  <g transform="rotate(2 626 421)">
