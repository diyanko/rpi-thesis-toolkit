<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 876" width="360" height="876" role="img" aria-labelledby="t d">
  <title id="t">When the build fails</title>
  <desc id="d">A short flowchart for a failed compile. 1: the build stopped or shows an error. 2: find the first error message and ignore the rest for now. 3: it names a file and a line; open that line and look just before it, too. 4: common culprits are a typo in a command, a missing closing brace or dollar sign, one of the special characters &amp; % _ # $ typed without a backslash, or a file name or path. 5: fixed it? Compile again; if a new first error appears, go back to step 2. 6: still stuck after a fix, or the error names a tool such as latexmk or Biber instead of your file: see Fixing problems, then ask for help. A note says your files are never changed by a failed build.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="1016">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="360" height="876" rx="18"/>
  <text class="hand" x="20" y="28" style="font-size:16px">when the build fails, start here</text>
  <rect class="ln thin sage dash" filter="url(#r)" x="20" y="42" width="320" height="76" rx="14"/>
  <text class="hand hs mid" x="180" y="68" style="font-size:16px">Errors are normal. Your files are</text>
  <text class="hand hs mid" x="180" y="90" style="font-size:16px">never changed by a failed build.</text>
  <text class="s mid" x="180" y="109" style="font-size:13px">Most fixes take a minute.</text>
  <rect class="w-terra" x="52" y="152" width="296" height="58" rx="14"/>
  <rect class="ln" filter="url(#r)" x="46" y="146" width="296" height="58" rx="14"/>
  <circle class="w-butter" cx="48" cy="148" r="15"/>
  <circle class="ln" filter="url(#r)" cx="48" cy="148" r="15"/>
  <text class="n mid" x="48" y="153.25" style="font-size:15px">1</text>
  <text class="mid" x="194" y="170.3" style="font-size:16px" font-weight="700">The build stopped</text>
  <text class="s mid" x="194" y="192.3" style="font-size:14px">or shows an error</text>
  <path class="ln" filter="url(#r)" d="M194.0 212 C 191.0 220, 197.0 226, 194.0 234" marker-end="url(#a)"/>
  <rect class="w-blue" x="52" y="248" width="296" height="58" rx="14"/>
  <rect class="ln" filter="url(#r)" x="46" y="242" width="296" height="58" rx="14"/>
  <circle class="w-butter" cx="48" cy="244" r="15"/>
  <circle class="ln" filter="url(#r)" cx="48" cy="244" r="15"/>
  <text class="n mid" x="48" y="249.25" style="font-size:15px">2</text>
  <text class="mid" x="194" y="266.3" style="font-size:16px" font-weight="700">Find the first error message</text>
  <text class="s mid" x="194" y="288.3" style="font-size:14px">ignore the rest for now</text>
  <path class="ln" filter="url(#r)" d="M194.0 308 C 191.0 316, 197.0 322, 194.0 330" marker-end="url(#a)"/>
  <rect class="w-blue" x="52" y="344" width="296" height="78" rx="14"/>
  <rect class="ln" filter="url(#r)" x="46" y="338" width="296" height="78" rx="14"/>
  <circle class="w-butter" cx="48" cy="340" r="15"/>
  <circle class="ln" filter="url(#r)" cx="48" cy="340" r="15"/>
  <text class="n mid" x="48" y="345.25" style="font-size:15px">3</text>
  <text class="mid" x="194" y="362.8" style="font-size:16px" font-weight="700">It names a file and a line</text>
  <text class="s mid" x="194" y="384.8" style="font-size:14px">open that line, and look</text>
  <text class="s mid" x="194" y="403.8" style="font-size:14px">just before it, too</text>
  <path class="ln" filter="url(#r)" d="M194.0 424 C 191.0 432, 197.0 438, 194.0 448" marker-end="url(#a)"/>
  <g transform="rotate(-1 194 535)">
  <rect class="w-butter" x="46" y="460" width="296" height="150" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="46" y="460" width="296" height="150" rx="3"/>
  <rect class="w-terra" x="174" y="453" width="40" height="13" opacity=".9"/>
  <text x="66" y="490" style="font-size:15px" font-weight="700">Common culprits</text>
  <circle cx="70" cy="513.4" r="2.6" style="fill:var(--terra)"/>
  <text x="82" y="518" style="font-size:14px">a typo in a command: <tspan class="code" style="font-size:14px;fill:var(--ink)">\cit</tspan></text>
  <circle cx="70" cy="537.4" r="2.6" style="fill:var(--terra)"/>
  <text x="82" y="542" style="font-size:14px">a missing <tspan class="m" style="font-size:14px">}</tspan> or <tspan class="m" style="font-size:14px">$</tspan></text>
  <circle cx="70" cy="561.4" r="2.6" style="fill:var(--terra)"/>
  <text x="82" y="566" style="font-size:14px"><tspan class="m" style="font-size:14px">&amp; % _ # $</tspan> without a backslash</text>
  <circle cx="70" cy="585.4" r="2.6" style="fill:var(--terra)"/>
  <text x="82" y="590" style="font-size:14px">a file name or path</text>
  </g>
  <circle class="w-butter" cx="48" cy="462" r="15"/>
  <circle class="ln" filter="url(#r)" cx="48" cy="462" r="15"/>
  <text class="n mid" x="48" y="467.25" style="font-size:15px">4</text>
  <path class="ln" filter="url(#r)" d="M194.0 620 C 191.0 628, 197.0 634, 194.0 644" marker-end="url(#a)"/>
  <rect class="w-sage" x="52" y="658" width="296" height="58" rx="14"/>
  <rect class="ln" filter="url(#r)" x="46" y="652" width="296" height="58" rx="14"/>
  <circle class="w-butter" cx="48" cy="654" r="15"/>
  <circle class="ln" filter="url(#r)" cx="48" cy="654" r="15"/>
  <text class="n mid" x="48" y="659.25" style="font-size:15px">5</text>
  <text class="mid" x="194" y="676.3" style="font-size:16px" font-weight="700">Fixed? Compile again.</text>
  <text class="s mid" x="194" y="698.3" style="font-size:14px">a new first error? back to 2</text>
  <path class="ln sage dash" filter="url(#r)" d="M40 682 C 6 652, 6 302, 38 272" marker-end="url(#as)"/>
  <path class="ln" filter="url(#r)" d="M194.0 718 C 191.0 726, 197.0 732, 194.0 740" marker-end="url(#a)"/>
  <rect class="w-plum" x="52" y="754" width="296" height="108" rx="14"/>
  <rect class="ln" filter="url(#r)" x="46" y="748" width="296" height="108" rx="14"/>
  <circle class="w-butter" cx="48" cy="750" r="15"/>
  <circle class="ln" filter="url(#r)" cx="48" cy="750" r="15"/>
  <text class="n mid" x="48" y="755.25" style="font-size:15px">6</text>
  <text class="mid" x="194" y="777.9" style="font-size:15.5px" font-weight="700">Still stuck after a fix,</text>
  <text class="mid" x="194" y="798.4" style="font-size:15.5px" font-weight="700">or it names a tool</text>
  <text class="s mid" x="194" y="819.9" style="font-size:13.5px">latexmk or Biber, not your file:</text>
  <text class="s mid" x="194" y="838.4" style="font-size:13.5px">see <tspan style="fill:var(--ink)" font-weight="700">Fixing problems</tspan>, then ask for help</text>
</svg>
