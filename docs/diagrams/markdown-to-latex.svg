<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" width="720" height="350" role="img" aria-labelledby="t d">
  <title id="t">From Markdown to LaTeX to the PDF</title>
  <desc id="d">One short passage in three forms. Left, the Markdown: a heading "## Field results", then "We visited **three sites** in *two seasons* [@lamport1994].", then the equation "$$y = mx + b$$". Middle, the LaTeX that Pandoc writes: \section{Field results}\label{field-results}, then "We visited \textbf{three sites} in \emph{two seasons} \autocite{lamport1994}.", then an equation environment, \begin{equation} y = mx + b \label{eq:line} \end{equation}. A note marks the equation lines as added by hand to give it a number and a label, because Pandoc writes an unnumbered equation. Right, the result in the PDF: the numbered section heading "2.1 Field results", the sentence with "three sites" in bold, "two seasons" in italics, and the citation [1], and the equation y = mx + b with its number (2.1) at the right margin.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="430">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="720" height="350" rx="18"/>
  <text class="hand" x="20" y="30" style="font-size:17px">Markdown</text>
  <text class="hand" x="234" y="30" style="font-size:17px">the LaTeX Pandoc writes</text>
  <text class="hand" x="522" y="30" style="font-size:17px">in the PDF</text>
  <!-- Markdown panel -->
  <rect class="w-sage" x="21" y="49" width="190" height="256" rx="12"/>
  <rect class="card" x="16" y="44" width="190" height="256" rx="12"/>
  <rect class="ln" filter="url(#r)" x="16" y="44" width="190" height="256" rx="12"/>
  <text class="code" x="28" y="74" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">##</tspan> Field results</text>
  <text class="code" x="28" y="114" style="font-size:13px;fill:var(--ink)" xml:space="preserve">We visited</text>
  <text class="code" x="28" y="134" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">**</tspan>three sites<tspan class="k">**</tspan> in</text>
  <text class="code" x="28" y="154" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">*</tspan>two seasons<tspan class="k">*</tspan></text>
  <text class="code" x="28" y="174" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">[@</tspan>lamport1994<tspan class="k">]</tspan>.</text>
  <text class="code" x="28" y="214" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">$$</tspan>y = mx + b<tspan class="k">$$</tspan></text>
  <!-- LaTeX panel; the terra band marks the lines added by hand -->
  <rect class="w-blue" x="235" y="49" width="264" height="256" rx="12"/>
  <rect class="card" x="230" y="44" width="264" height="256" rx="12"/>
  <rect class="ln" filter="url(#r)" x="230" y="44" width="264" height="256" rx="12"/>
  <rect class="w-terra" x="233" y="217" width="258" height="64"/>
  <text class="code" x="242" y="74" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">\section</tspan>{Field results}</text>
  <text class="code" x="242" y="94" style="font-size:13px;fill:var(--ink)" xml:space="preserve">  <tspan class="k">\label</tspan>{field-results}</text>
  <text class="code" x="242" y="134" style="font-size:13px;fill:var(--ink)" xml:space="preserve">We visited</text>
  <text class="code" x="242" y="154" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">\textbf</tspan>{three sites} in</text>
  <text class="code" x="242" y="174" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">\emph</tspan>{two seasons}</text>
  <text class="code" x="242" y="194" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">\autocite</tspan>{lamport1994}.</text>
  <text class="code" x="242" y="234" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">\begin</tspan>{equation}</text>
  <text class="code" x="242" y="254" style="font-size:13px;fill:var(--ink)" xml:space="preserve">  y = mx + b <tspan class="k">\label</tspan>{eq:line}</text>
  <text class="code" x="242" y="274" style="font-size:13px;fill:var(--ink)" xml:space="preserve"><tspan class="k">\end</tspan>{equation}</text>
  <path class="ln terra" filter="url(#r)" d="M330 334 C 326 322, 334 306, 330 290" marker-end="url(#at)"/>
  <text class="hand" x="346" y="330" style="font-size:15px">added by hand: number + label</text>
  <path class="ln" filter="url(#r)" d="M208 182 H226" marker-end="url(#a)"/>
  <path class="ln" filter="url(#r)" d="M496 182 H514" marker-end="url(#a)"/>
  <!-- Rendered PDF panel -->
  <path class="w-butter" transform="translate(6 6)" d="M518 44 H688 L704 60 V300 H518 Z"/>
  <path class="card" d="M518 44 H688 L704 60 V300 H518 Z"/>
  <path class="ln" filter="url(#r)" d="M518 44 H688 L704 60 V300 H518 Z M688 44 V60 H704"/>
  <text x="532" y="84" style="font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-size:17px;font-weight:700" xml:space="preserve">2.1   Field results</text>
  <text x="532" y="114" style="font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-size:15px">We visited <tspan font-weight="700">three sites</tspan></text>
  <text x="532" y="136" style="font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-size:15px">in <tspan font-style="italic">two seasons</tspan> [1].</text>
  <text class="mid" x="592" y="184" style="font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-size:16px;font-style:italic">y = mx + b</text>
  <text class="end" x="692" y="184" style="font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-size:15px">(2.1)</text>
  <path class="ln thin sage" d="M532 214 H690 M532 230 H668"/>
</svg>
