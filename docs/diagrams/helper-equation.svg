<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" width="720" height="324" role="img" aria-labelledby="t d">
  <title id="t">From a handwritten equation to a numbered one</title>
  <desc id="d">Illustrative example. You supply an equation written by hand or clicked together in an equation editor: x equals minus b plus or minus the square root of b squared minus 4ac, all over 2a. An equation editor, or an AI assistant that accepts images, gives LaTeX that goes between \begin{equation} and \end{equation}, with no dollar signs inside: x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}. Paste it into your chapter. The PDF shows the typeset fraction with its number, (2.3), at the right margin.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="404">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rr" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="404">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="720" height="324" rx="18"/>
  <path class="ln terra" filter="url(#r)" d="M170 104 C184 78, 240 78, 254 102" marker-end="url(#at)"/>
  <text class="hand mid" x="212" y="40" style="font-size:15px">equation editor, or an AI</text>
  <text class="hand mid" x="212" y="58" style="font-size:15px">assistant that accepts images</text>
  <text class="hand mid" x="212" y="75" style="font-size:13px;fill:var(--muted)">illustrative example</text>
  <path class="ln terra" filter="url(#r)" d="M430 104 C444 78, 500 78, 514 102" marker-end="url(#at)"/>
  <text class="hand mid" x="472" y="58" style="font-size:15px">paste into</text>
  <text class="hand mid" x="472" y="76" style="font-size:15px">your chapter</text>
  <rect class="w-butter" x="17" y="115" width="184" height="150" rx="4"/><rect class="card" x="12" y="110" width="184" height="150" rx="4"/><rect class="ln" filter="url(#r)" x="12" y="110" width="184" height="150" rx="4"/>
  <path class="ln thin blue" style="opacity:.25;stroke-width:1" d="M22 140 H186"/>
  <path class="ln thin blue" style="opacity:.25;stroke-width:1" d="M22 172 H186"/>
  <path class="ln thin blue" style="opacity:.25;stroke-width:1" d="M22 204 H186"/>
  <g filter="url(#rr)"><g transform="translate(104 183) scale(0.88) translate(-104 -183)"><text class="hand" x="17" y="192" style="font-size:20px;fill:var(--blue)">x =</text><text class="hand" x="61" y="177" style="font-size:20px;fill:var(--blue)">−b ±</text><path class="ln blue" d="M110 171 L115 176 L121 182 L128 153 H191"/><text class="hand" x="130" y="177" style="font-size:20px;fill:var(--blue)">b²−4ac</text><path class="ln blue" d="M57 187 C97 185, 147 189, 193 186"/><text class="hand" x="115" y="211" style="font-size:20px;fill:var(--blue)">2a</text></g></g>
  <text class="mid" x="104" y="290" style="font-size:15px;font-weight:700">You supply</text>
  <text class="s mid" x="104" y="310" style="font-size:13.5px">handwritten or clicked together</text>
  <rect class="w-blue" x="233" y="115" width="228" height="150" rx="4"/><rect class="card" x="228" y="110" width="228" height="150" rx="4"/><rect class="ln" filter="url(#r)" x="228" y="110" width="228" height="150" rx="4"/>
  <rect class="w-butter" x="234" y="140" width="216" height="21" opacity=".8"/>
  <rect class="w-butter" x="234" y="206" width="216" height="21" opacity=".8"/>
  <text class="code" x="252" y="155" style="font-size:14px" xml:space="preserve"><tspan style="fill:var(--plum)" font-weight="700">\begin{equation}</tspan></text>
  <text class="code" x="252" y="177" style="font-size:14px" xml:space="preserve"><tspan style="fill:var(--ink)">  x = </tspan><tspan class="k">\frac</tspan><tspan style="fill:var(--ink)">{-b </tspan><tspan class="k">\pm</tspan></text>
  <text class="code" x="252" y="199" style="font-size:14px" xml:space="preserve"><tspan style="fill:var(--ink)">    </tspan><tspan class="k">\sqrt</tspan><tspan style="fill:var(--ink)">{b^2-4ac}}{2a}</tspan></text>
  <text class="code" x="252" y="221" style="font-size:14px" xml:space="preserve"><tspan style="fill:var(--plum)" font-weight="700">\end{equation}</tspan></text>
  <text class="mid" x="342" y="290" style="font-size:15px;font-weight:700">LaTeX</text>
  <text class="s mid" x="342" y="310" style="font-size:13.5px">no $ signs inside equation</text>
  <path class="w-sage" transform="translate(5 5)" d="M488 110 H690 L708 128 V260 H488 Z"/><path class="card" d="M488 110 H690 L708 128 V260 H488 Z"/><path class="ln" filter="url(#r)" d="M488 110 H690 L708 128 V260 H488 Z M690 110 V128 H708"/>
  <rect x="502" y="136" width="174" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <rect x="502" y="150" width="140" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <text x="504" y="198" style="font-size:15px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif" font-style="italic">x</text>
  <text x="516" y="198" style="font-size:15px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">=</text>
  <text x="537" y="185" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">−<tspan font-style="italic">b</tspan> ±</text>
  <path class="ln" style="stroke-width:1.1" d="M573 179 L576 177 L580 187 L585 167 H644"/>
  <text x="587" y="185" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif"><tspan font-style="italic">b</tspan>² − 4<tspan font-style="italic">ac</tspan></text>
  <path class="ln" style="stroke-width:1.1" d="M535 193 H646"/>
  <text class="mid" x="590" y="210" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">2<tspan font-style="italic">a</tspan></text>
  <text class="end" x="694" y="198" style="font-size:14px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">(2.3)</text>
  <rect x="502" y="226" width="180" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <rect x="502" y="240" width="130" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.45"/>
  <text class="mid" x="598" y="290" style="font-size:15px;font-weight:700">Your PDF</text>
  <text class="s mid" x="598" y="310" style="font-size:13.5px">number at the right margin</text>
</svg>
