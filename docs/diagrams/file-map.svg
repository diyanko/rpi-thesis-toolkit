<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-labelledby="t d">
  <title id="t">File map of the project</title>
  <desc id="d">File map of the project. main.tex is the starting point; it loads preamble.tex (packages and citation style), metadata.tex (your name, degree, committee), then the front matter, the chapters, the reference list built from references.bib, and the appendices. rpi-thesis.cls supplies the formatting rules. Images live in figures/.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="680">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="720" height="600" rx="18"/>
  <rect class="w-terra" x="31" y="35" width="220" height="82" rx="14"/>
  <rect class="ln" filter="url(#r)" x="24" y="28" width="220" height="82" rx="14"/>
  <text class="m mid" x="134" y="62">rpi-thesis.cls</text>
  <text class="s mid" x="134" y="90">formatting rules</text>
  <path class="ln terra" filter="url(#r)" d="M134 120 C 130 136, 138 150, 134 166" marker-end="url(#at)"/>
  <path class="w-butter" d="M30 182 H234 L250 198 V310 H30 Z"/>
  <path class="card" d="M24 176 H228 L244 192 V304 H24 Z"/>
  <path class="ln" filter="url(#r)" d="M24 176 H228 L244 192 V304 H24 Z M228 176 V192 H244"/>
  <text class="m" x="42" y="214" style="font-size:22px">main.tex</text>
  <text class="s" x="42" y="244">the file you</text>
  <text class="s" x="42" y="268">compile</text>
  <text class="hand mid" x="134" y="336">start here</text>
  <path class="ln terra" filter="url(#r)" d="M84 344 C 110 352, 160 352, 186 344"/>
  <path class="w-sage" transform="translate(6 6)" d="M24 470 V 552 H244 V 482 H130 L118 470 Z"/>
  <path class="ln" filter="url(#r)" d="M24 470 V 552 H244 V 482 H130 L118 470 Z"/>
  <text class="m" x="42" y="512">figures/</text>
  <text class="s" x="42" y="538" style="font-size:17px">images for chapters</text>
  <path class="ln thin mut dash" filter="url(#r)" d="M352 62 V 522"/>
  <rect class="w-blue" x="385" y="33" width="330" height="70" rx="12"/>
  <rect class="ln" filter="url(#r)" x="380" y="28" width="330" height="70" rx="12"/>
  <circle class="w-butter" cx="352" cy="63" r="17"/>
  <circle class="ln" filter="url(#r)" cx="352" cy="63" r="17"/>
  <text class="n mid" x="352" y="70">1</text>
  <text class="m" x="398" y="58">preamble.tex</text>
  <text class="s" x="398" y="84" style="font-size:17px">packages, citation style</text>
  <rect class="w-blue" x="385" y="125" width="330" height="70" rx="12"/>
  <rect class="ln" filter="url(#r)" x="380" y="120" width="330" height="70" rx="12"/>
  <circle class="w-butter" cx="352" cy="155" r="17"/>
  <circle class="ln" filter="url(#r)" cx="352" cy="155" r="17"/>
  <text class="n mid" x="352" y="162">2</text>
  <text class="m" x="398" y="150">metadata.tex</text>
  <text class="s" x="398" y="176" style="font-size:17px">your name, degree, committee</text>
  <rect class="w-sage" x="385" y="217" width="330" height="70" rx="12"/>
  <rect class="ln" filter="url(#r)" x="380" y="212" width="330" height="70" rx="12"/>
  <circle class="w-butter" cx="352" cy="247" r="17"/>
  <circle class="ln" filter="url(#r)" cx="352" cy="247" r="17"/>
  <text class="n mid" x="352" y="254">3</text>
  <text class="m" x="398" y="242">frontmatter/</text>
  <text class="s" x="398" y="268" style="font-size:17px">abstract, acknowledgments</text>
  <rect class="w-sage" x="385" y="309" width="330" height="70" rx="12"/>
  <rect class="ln" filter="url(#r)" x="380" y="304" width="330" height="70" rx="12"/>
  <circle class="w-butter" cx="352" cy="339" r="17"/>
  <circle class="ln" filter="url(#r)" cx="352" cy="339" r="17"/>
  <text class="n mid" x="352" y="346">4</text>
  <text class="m" x="398" y="334">chapters/</text>
  <text class="s" x="398" y="360" style="font-size:17px">your writing</text>
  <rect class="w-plum" x="385" y="401" width="330" height="70" rx="12"/>
  <rect class="ln" filter="url(#r)" x="380" y="396" width="330" height="70" rx="12"/>
  <circle class="w-butter" cx="352" cy="431" r="17"/>
  <circle class="ln" filter="url(#r)" cx="352" cy="431" r="17"/>
  <text class="n mid" x="352" y="438">5</text>
  <text class="m" x="398" y="426">references.bib</text>
  <text class="s" x="398" y="452" style="font-size:17px">→ the reference list</text>
  <rect class="w-sage" x="385" y="493" width="330" height="70" rx="12"/>
  <rect class="ln" filter="url(#r)" x="380" y="488" width="330" height="70" rx="12"/>
  <circle class="w-butter" cx="352" cy="523" r="17"/>
  <circle class="ln" filter="url(#r)" cx="352" cy="523" r="17"/>
  <text class="n mid" x="352" y="530">6</text>
  <text class="m" x="398" y="518">appendices/</text>
