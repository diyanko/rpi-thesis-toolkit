  <path class="ln" filter="url(#r)" d="M252 236 C 286 236, 300 150, 332 76" marker-end="url(#a)"/>
  <text class="hand" x="258" y="290" style="font-size:18px">loads,</text>
  <text class="hand" x="258" y="313" style="font-size:18px">in order</text>
</svg>
