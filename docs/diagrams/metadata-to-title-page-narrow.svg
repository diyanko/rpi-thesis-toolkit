<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 940" width="360" height="940" role="img" aria-labelledby="t d">
  <title id="t">From metadata.tex to the title page</title>
  <desc id="d">How the lines in metadata.tex fill the title page. Pin 1: title = {Your thesis title} becomes the title, printed in capitals at the top of the page. Pin 2: author = {Your full name} becomes your name below the title. Pin 3: degree = masters becomes MASTER OF SCIENCE under the fixed words Submitted in Partial Fulfillment of the Requirements for the Degree of (doctoral gives Doctor of Philosophy, engineering-doctorate gives Doctor of Engineering). Pin 4: each committeemember line becomes one name in the list under Approved by, and the chair's name is followed by Chair. Pin 5: department becomes the department name near the bottom of the page, above Rensselaer Polytechnic Institute, Troy, New York. Pin 6: graduation-month and graduation-year become the bracketed date at the bottom, such as [May 2027]. The RPI seal, drawn as an empty dashed circle, is added by the class. A handwritten note says the fixed wording and layout come from the class file.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="440" height="1020">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="360" height="940" rx="18"/>
  <rect class="w-butter" x="16" y="20" width="340" height="425.8" rx="12" opacity=".7"/>
  <rect class="card" x="10" y="14" width="340" height="425.8" rx="12"/>
  <rect class="w-butter" x="12" y="78.94" width="336" height="20"/>
  <rect class="w-butter" x="12" y="101.94" width="336" height="20"/>
  <rect class="w-butter" x="12" y="124.94" width="336" height="20"/>
  <rect class="w-butter" x="12" y="147.94" width="336" height="43"/>
  <rect class="w-butter" x="12" y="193.94" width="336" height="43"/>
  <rect class="w-butter" x="12" y="295.94" width="336" height="135"/>
  <rect class="ln" filter="url(#r)" x="10" y="14" width="340" height="425.8" rx="12"/>
  <path class="ln thin mut" d="M10 48 H350"/>
  <text class="m" x="24" y="37" style="font-size:14px">metadata.tex</text>
  <text class="hand end" x="336" y="37" style="font-size:15px">you edit this</text>
  <text class="code" x="48" y="71" style="font-size:14px" xml:space="preserve">\thesissetup{</text>
  <text class="code" x="48" y="94" style="font-size:14px" xml:space="preserve">  title = <tspan style="fill:var(--ink)" font-weight="700">{Your thesis title},</tspan></text>
  <text class="code" x="48" y="117" style="font-size:14px" xml:space="preserve">  author = <tspan style="fill:var(--ink)" font-weight="700">{Your full name},</tspan></text>
  <text class="code" x="48" y="140" style="font-size:14px" xml:space="preserve">  degree = <tspan style="fill:var(--ink)" font-weight="700">masters,</tspan></text>
  <text class="code" x="48" y="163" style="font-size:14px" xml:space="preserve">  department = <tspan style="fill:var(--ink)" font-weight="700">{Department of</tspan></text>
  <text class="code" x="48" y="186" style="font-size:14px" xml:space="preserve">    <tspan style="fill:var(--ink)" font-weight="700">Your Full Department Name},</tspan></text>
  <text class="code" x="48" y="209" style="font-size:14px" xml:space="preserve">  graduation-month = <tspan style="fill:var(--ink)" font-weight="700">May,</tspan></text>
  <text class="code" x="48" y="232" style="font-size:14px" xml:space="preserve">  graduation-year = <tspan style="fill:var(--ink)" font-weight="700">{2027},</tspan></text>
  <text class="code" x="48" y="255" style="font-size:14px" xml:space="preserve">  …</text>
  <text class="code" x="48" y="278" style="font-size:14px" xml:space="preserve">}</text>
  <text class="code" x="48" y="311" style="font-size:14px" xml:space="preserve">\committeemember[Chair]<tspan style="fill:var(--ink)" font-weight="700"></tspan></text>
  <text class="code" x="48" y="334" style="font-size:14px" xml:space="preserve">  <tspan style="fill:var(--ink)" font-weight="700">{Your committee chair}</tspan></text>
  <text class="code" x="48" y="357" style="font-size:14px" xml:space="preserve">\committeemember<tspan style="fill:var(--ink)" font-weight="700"></tspan></text>
  <text class="code" x="48" y="380" style="font-size:14px" xml:space="preserve">  <tspan style="fill:var(--ink)" font-weight="700">{Committee member two}</tspan></text>
  <text class="code" x="48" y="403" style="font-size:14px" xml:space="preserve">\committeemember<tspan style="fill:var(--ink)" font-weight="700"></tspan></text>
  <text class="code" x="48" y="426" style="font-size:14px" xml:space="preserve">  <tspan style="fill:var(--ink)" font-weight="700">{Committee member three}</tspan></text>
  <circle class="w-butter" cx="29" cy="89.1" r="11"/>
  <circle class="ln" filter="url(#r)" cx="29" cy="89.1" r="11"/>
  <text class="n mid" x="29" y="94" style="font-size:14px">1</text>
  <circle class="w-butter" cx="29" cy="112.1" r="11"/>
  <circle class="ln" filter="url(#r)" cx="29" cy="112.1" r="11"/>
  <text class="n mid" x="29" y="117" style="font-size:14px">2</text>
  <circle class="w-butter" cx="29" cy="135.1" r="11"/>
  <circle class="ln" filter="url(#r)" cx="29" cy="135.1" r="11"/>
  <text class="n mid" x="29" y="140" style="font-size:14px">3</text>
  <circle class="w-butter" cx="29" cy="169.6" r="11"/>
  <circle class="ln" filter="url(#r)" cx="29" cy="169.6" r="11"/>
  <text class="n mid" x="29" y="174.5" style="font-size:14px">5</text>
  <circle class="w-butter" cx="29" cy="215.6" r="11"/>
  <circle class="ln" filter="url(#r)" cx="29" cy="215.6" r="11"/>
  <text class="n mid" x="29" y="220.5" style="font-size:14px">6</text>
  <circle class="w-butter" cx="29" cy="363.6" r="11"/>
  <circle class="ln" filter="url(#r)" cx="29" cy="363.6" r="11"/>
  <text class="n mid" x="29" y="368.5" style="font-size:14px">4</text>
  <path class="ln" filter="url(#r)" d="M180 451.8 C 176 463.8, 184 473.8, 180 487.8" marker-end="url(#a)"/>
  <text class="hand" x="196" y="477.8" style="font-size:16px">becomes your title page</text>
  <rect class="w-sage" x="69" y="506.8" width="274" height="354.588" rx="3"/>
  <rect class="card" x="62" y="499.8" width="274" height="354.588" rx="3"/>
  <rect class="ln" filter="url(#r)" x="62" y="499.8" width="274" height="354.588" rx="3"/>
  <text class="mid" x="199" y="535.259" style="font-size:14px" font-weight="700">YOUR THESIS TITLE</text>
  <text class="mid" x="199" y="561.853" style="font-size:13.5px" font-weight="700">Your full name</text>
  <rect x="114.06" y="576.519" width="169.88" height="4" rx="2" style="fill:var(--muted);opacity:.5"/>
  <rect x="157.9" y="586.447" width="82.2" height="4" rx="2" style="fill:var(--muted);opacity:.5"/>
  <text class="mid" x="199" y="607.949" style="font-size:13px" font-style="italic">MASTER OF SCIENCE</text>
  <rect x="163.38" y="625.452" width="71.24" height="4" rx="2" style="fill:var(--muted);opacity:.5"/>
  <text class="mid" x="199" y="643.408" style="font-size:13px">Your committee chair, Chair</text>
  <text class="mid" x="199" y="661.408" style="font-size:13px">Committee member two</text>
  <text class="mid" x="199" y="679.408" style="font-size:13px">Committee member three</text>
  <circle class="ln thin mut dash" cx="199" cy="732.055" r="27.4"/>
  <text class="s" x="234.4" y="720.43" style="font-size:12.5px" font-style="italic">RPI seal</text>
  <text class="s" x="234.4" y="736.43" style="font-size:12.5px" font-style="italic">(added by</text>
  <text class="s" x="234.4" y="752.43" style="font-size:12.5px" font-style="italic">the class)</text>
  <text class="mid" x="199" y="783.471" style="font-size:12px" font-style="italic">Department of Your Full Department Name</text>
  <rect x="130.5" y="794.59" width="137" height="4" rx="2" style="fill:var(--muted);opacity:.5"/>
  <rect x="157.9" y="805.228" width="82.2" height="4" rx="2" style="fill:var(--muted);opacity:.5"/>
  <text class="mid" x="199" y="829.567" style="font-size:13px">[May 2027]</text>
  <circle class="w-butter" cx="36" cy="530.709" r="11"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="530.709" r="11"/>
  <text class="n mid" x="36" y="535.609" style="font-size:14px">1</text>
  <circle class="w-butter" cx="36" cy="557.303" r="11"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="557.303" r="11"/>
  <text class="n mid" x="36" y="562.203" style="font-size:14px">2</text>
  <circle class="w-butter" cx="36" cy="603.399" r="11"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="603.399" r="11"/>
  <text class="n mid" x="36" y="608.299" style="font-size:14px">3</text>
  <circle class="w-butter" cx="36" cy="656.858" r="11"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="656.858" r="11"/>
  <text class="n mid" x="36" y="661.758" style="font-size:14px">4</text>
  <circle class="w-butter" cx="36" cy="778.921" r="11"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="778.921" r="11"/>
  <text class="n mid" x="36" y="783.821" style="font-size:14px">5</text>
  <circle class="w-butter" cx="36" cy="825.017" r="11"/>
  <circle class="ln" filter="url(#r)" cx="36" cy="825.017" r="11"/>
  <text class="n mid" x="36" y="829.917" style="font-size:14px">6</text>
  <text class="hand" x="18" y="898.388" style="font-size:17px">fixed wording and layout</text>
  <text class="hand" x="18" y="920.388" style="font-size:17px">come from the class file</text>
  <path class="ln terra" filter="url(#r)" d="M206 904.388 C 240 894.388, 252 864.388, 252 807.654" marker-end="url(#at)"/>
</svg>
