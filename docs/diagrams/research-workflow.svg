<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 516" width="720" height="516" role="img" aria-labelledby="t d">
  <title id="t">Research workflow: separate pieces come together, and you iterate</title>
  <desc id="d">The thesis grows from several independent pieces. On the left, under "draft and discuss": Markdown notes, for example in Obsidian or HackMD; Google Docs with advisor comments; and an existing Word draft. Below them, references kept in a Zotero library, and figure sources such as data, plotting scripts, and .drawio diagrams. Stable sections move gradually from the drafts into separate chapter files in chapters/, such as 01-introduction.tex, 02-research.tex, and 03. Zotero exports references.bib, and figures are exported as image files into figures/. main.tex brings the chapters, references, and figures together and is compiled into one thesis PDF. A loop arrow runs from the PDF back to the drafts: read, get feedback, revise. A note says to check the assembled PDF throughout.</desc>
