<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d">
  <title id="t">Paste words without importing stray formatting</title>
  <desc id="d">Three views of the same teaching text: Research question, Compare the samples., and Describe the result. On the left, copied formatting mixes fonts, sizes and colors. In the middle, pasting as plain text keeps the words without those styles. On the right, the words use one shared thesis style, with Research question marked as a heading. Keep the words. Leave stray styles behind. Add headings and emphasis in LaTeX.</desc>
  <style>
    svg { --bg: #faf5ea; --card: #fffcf5; --ink: #2d2620; --muted: #625547;
      --terra: #a24a24; --sage: #4a6b42; --plum: #70466a; --blue: #24518c; --red: #c8102e;
      --terra-w: #f6dfcd; --sage-w: #e4ecd2; --plum-w: #f1e0ea; --blue-w: #e0e6ef; --butter-w: #f7e8b3; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #181614; --card: #27231e; --ink: #f2ece2; --muted: #b9ae9d;
        --terra: #f6a57f; --sage: #a6d49a; --plum: #e0b6dc; --blue: #a2c8fb; --red: #ff8d98;
        --terra-w: #3b2418; --sage-w: #273b27; --plum-w: #34233a; --blue-w: #1d2c43; --butter-w: #3a3118; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
    .paper { fill: var(--card); } .highlight { fill: var(--blue-w); }
    .line { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .soft { stroke: var(--muted); stroke-width: 1.6; }
    .arrow { fill: none; stroke: var(--blue); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .title { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; fill: var(--terra); }
    .label { font-weight: 700; }
    .plain { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; }
    .thesis { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; }
    .note { fill: var(--muted); font-size: 16px; }
    .chapter { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .selected { fill: var(--blue); font-weight: 700; }
  </style>
  <rect class="bg" width="720" height="400" rx="18"/>
  <text class="title" x="20" y="33" style="font-size:20px">pasting without stray formatting</text>
  <text class="label" x="20" y="76">Copied formatting</text>
  <text class="label" x="258" y="76">Paste as plain text</text>
  <text class="label" x="498" y="76">Shared formatting</text>

  <rect class="paper" x="14" y="94" width="212" height="210" rx="9"/>
  <path class="line" d="M25 94.4 Q122 93.1 215 94.5 Q226.6 94 226 106 Q225.3 194 226.4 292 Q226.2 304.7 214 304 Q120 305.2 25 303.6 Q13.1 304.4 14 292 Q14.8 193 13.6 106 Q13.3 93.8 25 94.4 Z"/>
  <text x="26" y="147" style="font-family:Georgia,serif;font-size:21px;font-style:italic;fill:var(--terra)">Research question</text>
  <text x="26" y="200" style="font-size:16.5px;font-weight:700;fill:var(--blue)">Compare the samples.</text>
  <text class="plain" x="26" y="257">Describe the result.</text>

  <path class="arrow" d="M232 196 Q240 193 248 196 M241 189 L248 196 L240 202"/>

  <rect class="paper" x="254" y="94" width="212" height="210" rx="9"/>
  <path class="line" d="M265 94.3 Q360 93 455 94.5 Q466.6 94 466 106 Q465.1 195 466.4 292 Q466.1 304.8 454 304 Q360 305.1 265 303.6 Q253.2 304.5 254 292 Q254.8 193 253.6 106 Q253.3 93.7 265 94.3 Z"/>
  <text class="plain" x="266" y="147">Research question</text>
  <text class="plain" x="266" y="200">Compare the samples.</text>
  <text class="plain" x="266" y="257">Describe the result.</text>

  <path class="arrow" d="M472 196 Q480 193 488 196 M481 189 L488 196 L480 202"/>

  <rect class="paper" x="494" y="94" width="212" height="210" rx="9"/>
  <path class="line" d="M505 94.4 Q600 93.1 695 94.5 Q706.6 94 706 106 Q705.2 194 706.4 292 Q706.1 304.8 694 304 Q600 305.1 505 303.6 Q493.1 304.5 494 292 Q494.8 193 493.6 106 Q493.3 93.7 505 94.4 Z"/>
  <text class="thesis" x="506" y="147" style="font-size:21px;font-weight:700">Research question</text>
  <text class="thesis" x="506" y="200">Compare the samples.</text>
  <text class="thesis" x="506" y="257">Describe the result.</text>

  <text x="360" y="350" text-anchor="middle" style="font-size:18px">Keep the words. Leave stray styles behind.</text>
  <text class="note" x="360" y="378" text-anchor="middle">Add headings and emphasis in LaTeX.</text>
</svg>
