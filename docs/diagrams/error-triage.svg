<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" width="720" height="548" role="img" aria-labelledby="t d">
  <title id="t">When the build fails</title>
  <desc id="d">A short flowchart for a failed compile. 1: the build stopped or shows an error. 2: find the first error message and ignore the rest for now. 3: it names a file and a line; open that line and look just before it, too. 4: common culprits are a typo in a command, a missing closing brace or dollar sign, one of the special characters &amp; % _ # $ typed without a backslash, or a file name or path. 5: fixed it? Compile again; if a new first error appears, go back to step 2. 6: still stuck after a fix, or the error names a tool such as latexmk or Biber instead of your file: see Fixing problems, then ask for help. A note says your files are never changed by a failed build.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="628">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="720" height="548" rx="18"/>
  <text class="hand" x="40" y="30" style="font-size:17px">when the build fails, start here</text>
  <rect class="w-terra" x="62" y="56" width="286" height="62" rx="14"/>
  <rect class="ln" filter="url(#r)" x="56" y="50" width="286" height="62" rx="14"/>
  <circle class="w-butter" cx="58" cy="52" r="15"/>
  <circle class="ln" filter="url(#r)" cx="58" cy="52" r="15"/>
  <text class="n mid" x="58" y="57.25" style="font-size:15px">1</text>
  <text class="mid" x="199" y="76.35" style="font-size:17px" font-weight="700">The build stopped</text>
  <text class="s mid" x="199" y="99.35" style="font-size:14.5px">or shows an error</text>
  <path class="ln" filter="url(#r)" d="M199.0 120 C 196.0 130, 202.0 136, 199.0 146" marker-end="url(#a)"/>
  <rect class="w-blue" x="62" y="160" width="286" height="62" rx="14"/>
  <rect class="ln" filter="url(#r)" x="56" y="154" width="286" height="62" rx="14"/>
  <circle class="w-butter" cx="58" cy="156" r="15"/>
  <circle class="ln" filter="url(#r)" cx="58" cy="156" r="15"/>
  <text class="n mid" x="58" y="161.25" style="font-size:15px">2</text>
  <text class="mid" x="199" y="180.35" style="font-size:17px" font-weight="700">Find the first error message</text>
  <text class="s mid" x="199" y="203.35" style="font-size:14.5px">ignore the rest for now</text>
  <path class="ln" filter="url(#r)" d="M199.0 224 C 196.0 234, 202.0 240, 199.0 250" marker-end="url(#a)"/>
  <rect class="w-blue" x="62" y="264" width="286" height="84" rx="14"/>
  <rect class="ln" filter="url(#r)" x="56" y="258" width="286" height="84" rx="14"/>
  <circle class="w-butter" cx="58" cy="260" r="15"/>
  <circle class="ln" filter="url(#r)" cx="58" cy="260" r="15"/>
  <text class="n mid" x="58" y="265.25" style="font-size:15px">3</text>
  <text class="mid" x="199" y="285.6" style="font-size:17px" font-weight="700">It names a file and a line</text>
  <text class="s mid" x="199" y="308.6" style="font-size:14.5px">open that line, and look</text>
  <text class="s mid" x="199" y="328.1" style="font-size:14.5px">just before it, too</text>
  <g transform="rotate(1.5 538 324)">
  <rect class="w-butter" x="392" y="244" width="292" height="160" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="392" y="244" width="292" height="160" rx="3"/>
  <rect class="w-terra" x="518" y="237" width="40" height="13" opacity=".9"/>
  <text x="412" y="274" style="font-size:16px" font-weight="700">Common culprits</text>
  <circle cx="416" cy="297.1" r="2.6" style="fill:var(--terra)"/>
  <text x="428" y="302" style="font-size:15px">a typo in a command: <tspan class="code" style="font-size:15px;fill:var(--ink)">\cit</tspan></text>
  <circle cx="416" cy="322.1" r="2.6" style="fill:var(--terra)"/>
  <text x="428" y="327" style="font-size:15px">a missing <tspan class="m" style="font-size:15px">}</tspan> or <tspan class="m" style="font-size:15px">$</tspan></text>
  <circle cx="416" cy="347.1" r="2.6" style="fill:var(--terra)"/>
  <text x="428" y="352" style="font-size:15px"><tspan class="m" style="font-size:15px">&amp; % _ # $</tspan> without a backslash</text>
  <circle cx="416" cy="372.1" r="2.6" style="fill:var(--terra)"/>
  <text x="428" y="377" style="font-size:15px">a file name or path</text>
  </g>
  <circle class="w-butter" cx="394" cy="246" r="15"/>
  <circle class="ln" filter="url(#r)" cx="394" cy="246" r="15"/>
  <text class="n mid" x="394" y="251.25" style="font-size:15px">4</text>
  <path class="ln" filter="url(#r)" d="M354 300 C 360 296, 368 306, 382 304" marker-end="url(#a)"/>
  <path class="ln" filter="url(#r)" d="M199.0 350 C 196.0 362, 202.0 372, 199.0 382" marker-end="url(#a)"/>
  <rect class="w-sage" x="62" y="396" width="286" height="62" rx="14"/>
  <rect class="ln" filter="url(#r)" x="56" y="390" width="286" height="62" rx="14"/>
  <circle class="w-butter" cx="58" cy="392" r="15"/>
  <circle class="ln" filter="url(#r)" cx="58" cy="392" r="15"/>
  <text class="n mid" x="58" y="397.25" style="font-size:15px">5</text>
  <text class="mid" x="199" y="416.35" style="font-size:17px" font-weight="700">Fixed? Compile again.</text>
  <text class="s mid" x="199" y="439.35" style="font-size:14.5px">a new first error? back to 2</text>
  <path class="ln sage dash" filter="url(#r)" d="M48 421 C 10 410, 10 200, 46 186" marker-end="url(#as)"/>
  <path class="ln" filter="url(#r)" d="M354 432 C 360 440, 366 470, 382 474" marker-end="url(#a)"/>
  <rect class="w-plum" x="398" y="444" width="292" height="92" rx="14"/>
  <rect class="ln" filter="url(#r)" x="392" y="438" width="292" height="92" rx="14"/>
  <circle class="w-butter" cx="394" cy="440" r="15"/>
  <circle class="ln" filter="url(#r)" cx="394" cy="440" r="15"/>
  <text class="n mid" x="394" y="445.25" style="font-size:15px">6</text>
  <text class="mid" x="538" y="459.3" style="font-size:16px" font-weight="700">Still stuck after a fix,</text>
  <text class="mid" x="538" y="480.3" style="font-size:16px" font-weight="700">or it names a tool</text>
  <text class="s mid" x="538" y="502.3" style="font-size:14px">latexmk or Biber, not your file:</text>
  <text class="s mid" x="538" y="521.3" style="font-size:14px">see <tspan style="fill:var(--ink)" font-weight="700">Fixing problems</tspan>, then ask for help</text>
  <g transform="rotate(-1.5 540 130)">
  <rect class="ln thin sage dash" filter="url(#r)" x="400" y="64" width="282" height="124" rx="14"/>
  <text class="hand hs mid" x="541" y="98" style="font-size:19px">Errors are normal.</text>
  <text class="hand hs mid" x="541" y="126" style="font-size:18px">Your files are never changed</text>
  <text class="hand hs mid" x="541" y="150" style="font-size:18px">by a failed build.</text>
  <text class="s mid" x="541" y="174" style="font-size:14px">Most fixes take a minute.</text>
  </g>
</svg>
