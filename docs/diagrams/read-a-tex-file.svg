<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 494" width="720" height="494" role="img" aria-labelledby="t d">
  <title id="t">How to read a .tex file</title>
  <desc id="d">A few lines of a chapter file with six numbered pins. The lines are: \section{A figure}; Figure~\ref{fig:example} shows a layout described in~\parencite{lamport1994}.; a comment line, % Ask my advisor about colors.; a blank line; The caption goes below the image.; then \begin{figure}[htbp], \includegraphics{example-image}, \caption{A sample image.}, \label{fig:example}, and \end{figure}. Pin 1: a command starts with a backslash, such as \section, \parencite, or \caption. Pin 2: braces hold what the command acts on, such as the section title. Pin 3: \begin and \end wrap an environment, here a figure. Pin 4: % starts a note that LaTeX ignores; it never prints. Pin 5: a blank line starts a new paragraph. Pin 6: \parencite{key} and \ref{label} are filled in for you when you compile, with the citation and the figure number. A handwritten note says everything else is your own writing.</desc>
  <style>
    svg { --bg: #faf5ea; --card: #fffcf5; --ink: #2d2620; --muted: #625547;
      --terra: #a24a24; --sage: #4a6b42; --plum: #70466a; --blue: #24518c; --red: #c8102e;
      --terra-w: #f6dfcd; --sage-w: #e4ecd2; --plum-w: #f1e0ea; --blue-w: #e0e6ef; --butter-w: #f7e8b3; }
    @media (prefers-color-scheme: dark) {
