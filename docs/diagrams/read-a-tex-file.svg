<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 494" width="720" height="494" role="img" aria-labelledby="t d">
  <title id="t">How to read a .tex file</title>
  <desc id="d">A few lines of a chapter file with six numbered pins. The lines are: \section{A figure}; Figure~\ref{fig:example} shows a layout described by Lamport~\cite{lamport1994}.; a comment line, % Ask my advisor about colors.; a blank line; The caption goes below the image.; then \begin{figure}[htbp], \includegraphics{figures/example.png}, \caption{A sample image.}, \label{fig:example}, and \end{figure}. Pin 1: a command starts with a backslash, such as \section, \cite, or \caption. Pin 2: braces hold what the command acts on, such as the section title. Pin 3: \begin and \end wrap an environment, here a figure. Pin 4: % starts a note that LaTeX ignores; it never prints. Pin 5: a blank line starts a new paragraph. Pin 6: \cite{key} and \ref{label} are filled in for you when you compile, with the citation and the figure number. A handwritten note says everything else is your own writing.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="574">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="720" height="494" rx="18"/>
  <text class="hand" x="20" y="28" style="font-size:17px">a few lines of a chapter file</text>
  <path class="w-blue" transform="translate(6 6)" d="M16 42 H434 L454 62 V426 H16 Z"/>
  <path class="card" d="M16 42 H434 L454 62 V426 H16 Z"/>
  <rect class="w-butter" x="134.92000000000002" y="95.9" width="95.9" height="21.5" rx="3"/>
  <rect class="w-butter" x="19" y="216.9" width="432" height="20.5" opacity=".8"/>
  <path class="ln" filter="url(#r)" d="M16 42 H434 L454 62 V426 H16 Z M434 42 V62 H454"/>
  <text class="m" x="32" y="70" style="font-size:14px">chapters/02-research.tex</text>
  <path class="ln thin mut" d="M16 82 H454"/>
  <text class="code" x="66" y="110.4" style="font-size:14.5px" xml:space="preserve"><tspan class="k">\section</tspan><tspan class="k">{</tspan><tspan style="fill:var(--ink)" font-weight="700">A figure</tspan><tspan class="k">}</tspan></text>
  <text class="code" x="66" y="140.4" style="font-size:14.5px" xml:space="preserve"><tspan style="fill:var(--ink)">Figure~</tspan><tspan style="fill:var(--blue)" font-weight="700">\ref{fig:example}</tspan><tspan style="fill:var(--ink)"> shows a layout</tspan></text>
  <text class="code" x="66" y="170.4" style="font-size:14.5px" xml:space="preserve"><tspan style="fill:var(--ink)">described by Lamport~</tspan><tspan style="fill:var(--blue)" font-weight="700">\cite{lamport1994}</tspan><tspan style="fill:var(--ink)">.</tspan></text>
  <text class="code" x="66" y="200.4" style="font-size:14.5px" xml:space="preserve"><tspan style="fill:var(--sage)" font-style="italic">% Ask my advisor about colors.</tspan></text>
  <text class="code" x="66" y="260.4" style="font-size:14.5px" xml:space="preserve"><tspan style="fill:var(--ink)">The caption goes below the image.</tspan></text>
  <text class="code" x="66" y="290.4" style="font-size:14.5px" xml:space="preserve"><tspan style="fill:var(--plum)" font-weight="700">\begin{figure}</tspan><tspan style="fill:var(--ink)">[htbp]</tspan></text>
  <text class="code" x="66" y="320.4" style="font-size:14.5px" xml:space="preserve"><tspan style="fill:var(--ink)">  </tspan><tspan class="k">\includegraphics</tspan><tspan class="k">{</tspan><tspan style="fill:var(--ink)" font-weight="700">figures/example.png</tspan><tspan class="k">}</tspan></text>
  <text class="code" x="66" y="350.4" style="font-size:14.5px" xml:space="preserve"><tspan style="fill:var(--ink)">  </tspan><tspan class="k">\caption</tspan><tspan class="k">{</tspan><tspan style="fill:var(--ink)" font-weight="700">A sample image.</tspan><tspan class="k">}</tspan></text>
  <text class="code" x="66" y="380.4" style="font-size:14.5px" xml:space="preserve"><tspan style="fill:var(--ink)">  </tspan><tspan class="k">\label</tspan><tspan class="k">{</tspan><tspan style="fill:var(--ink)" font-weight="700">fig:example</tspan><tspan class="k">}</tspan></text>
  <text class="code" x="66" y="410.4" style="font-size:14.5px" xml:space="preserve"><tspan style="fill:var(--plum)" font-weight="700">\end{figure}</tspan></text>
  <text class="hand end" x="440" y="230.4" style="font-size:14.5px">(blank line)</text>
  <path class="ln thin blue" filter="url(#r)" d="M60 127.9 H56 V174.4 H60"/>
  <path class="ln thin plum" filter="url(#r)" d="M60 277.9 H56 V414.4 H60"/>
  <circle class="w-butter" cx="38" cy="105.4" r="10"/>
  <circle class="ln" filter="url(#r)" cx="38" cy="105.4" r="10"/>
  <text class="n mid" x="38" y="109.95" style="font-size:13px">1</text>
  <circle class="w-butter" cx="243.82" cy="105.4" r="10"/>
  <circle class="ln" filter="url(#r)" cx="243.82" cy="105.4" r="10"/>
  <text class="n mid" x="243.82" y="109.95" style="font-size:13px">2</text>
  <circle class="w-butter" cx="38" cy="150.4" r="10"/>
  <circle class="ln" filter="url(#r)" cx="38" cy="150.4" r="10"/>
  <text class="n mid" x="38" y="154.95" style="font-size:13px">6</text>
  <circle class="w-butter" cx="38" cy="195.4" r="10"/>
  <circle class="ln" filter="url(#r)" cx="38" cy="195.4" r="10"/>
  <text class="n mid" x="38" y="199.95" style="font-size:13px">4</text>
  <circle class="w-butter" cx="38" cy="225.4" r="10"/>
  <circle class="ln" filter="url(#r)" cx="38" cy="225.4" r="10"/>
  <text class="n mid" x="38" y="229.95" style="font-size:13px">5</text>
  <circle class="w-butter" cx="38" cy="345.4" r="10"/>
  <circle class="ln" filter="url(#r)" cx="38" cy="345.4" r="10"/>
  <text class="n mid" x="38" y="349.95" style="font-size:13px">3</text>
  <circle class="w-butter" cx="489" cy="60.75" r="11"/>
  <circle class="ln" filter="url(#r)" cx="489" cy="60.75" r="11"/>
  <text class="n mid" x="489" y="65.65" style="font-size:14px">1</text>
  <text x="510" y="66" style="font-size:15px" font-weight="700">A command starts</text>
  <text x="510" y="85" style="font-size:15px" font-weight="700">with a backslash</text>
  <text class="code" x="510" y="105" style="font-size:14px;fill:var(--terra);font-weight:700">\section  \cite</text>
  <circle class="w-butter" cx="489" cy="123.75" r="11"/>
  <circle class="ln" filter="url(#r)" cx="489" cy="123.75" r="11"/>
  <text class="n mid" x="489" y="128.65" style="font-size:14px">2</text>
  <text x="510" y="129" style="font-size:15px" font-weight="700">Braces hold what the</text>
  <text x="510" y="148" style="font-size:15px" font-weight="700">command acts on</text>
  <text class="s" x="510" y="168" style="font-size:14px">a title, a file, a key</text>
  <circle class="w-butter" cx="489" cy="186.75" r="11"/>
  <circle class="ln" filter="url(#r)" cx="489" cy="186.75" r="11"/>
  <text class="n mid" x="489" y="191.65" style="font-size:14px">3</text>
  <text x="510" y="192" style="font-size:15px" font-weight="700">\begin and \end wrap</text>
  <text x="510" y="211" style="font-size:15px" font-weight="700">an environment</text>
  <text class="s" x="510" y="231" style="font-size:14px">here, one figure</text>
  <circle class="w-butter" cx="489" cy="249.75" r="11"/>
  <circle class="ln" filter="url(#r)" cx="489" cy="249.75" r="11"/>
  <text class="n mid" x="489" y="254.65" style="font-size:14px">4</text>
  <text x="510" y="255" style="font-size:15px" font-weight="700">% starts a note</text>
  <text x="510" y="274" style="font-size:15px" font-weight="700">LaTeX ignores</text>
  <text class="s" x="510" y="294" style="font-size:14px">it never prints</text>
  <circle class="w-butter" cx="489" cy="312.75" r="11"/>
  <circle class="ln" filter="url(#r)" cx="489" cy="312.75" r="11"/>
  <text class="n mid" x="489" y="317.65" style="font-size:14px">5</text>
  <text x="510" y="318" style="font-size:15px" font-weight="700">A blank line starts</text>
  <text x="510" y="337" style="font-size:15px" font-weight="700">a new paragraph</text>
  <circle class="w-butter" cx="489" cy="355.75" r="11"/>
  <circle class="ln" filter="url(#r)" cx="489" cy="355.75" r="11"/>
  <text class="n mid" x="489" y="360.65" style="font-size:14px">6</text>
  <text x="510" y="361" style="font-size:15px" font-weight="700">\cite{key} and \ref{label}</text>
  <text x="510" y="380" style="font-size:15px" font-weight="700">are filled in for you</text>
  <text class="s" x="510" y="400" style="font-size:14px">the citation and the number</text>
  <text class="hand" x="36" y="462" style="font-size:18px">Everything else is your own writing.</text>
</svg>
