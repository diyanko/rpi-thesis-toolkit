  <text x="28" y="96" class="code" style="fill:var(--ink)">chapters/</text>
  <text x="28" y="116" class="code" style="fill:var(--ink)">02-research.tex</text>
  <path class="line soft" d="M13 126 Q179 125.3 347 126"/>
  <text x="28" y="152" class="chapter">Research</text>
  <text x="28" y="178" style="font-size:16px">Work on this chapter.</text>
  <rect class="highlight" x="26" y="189" width="308" height="32" rx="5"/>
  <text x="38" y="211" class="selected" style="font-size:16px">Your latest edit</text>
  <path class="arrow" d="M180 249 Q177 262 180 275 M172 266 L180 275 L188 266"/>
  <text x="204" y="266" class="note">compile</text>
  <text class="note" x="24" y="302"><tspan class="code">main.tex</tspan> brings files together</text>
  <path class="paper" d="M86 338 L306 337 L306 554 L86 555 Z"/>
  <path class="line soft" d="M86 338 L306 337 L306 554 L86 555"/>
  <path class="paper" d="M78 330 L298 329 L298 546 L78 547 Z"/>
  <path class="line soft" d="M78 330 L298 329 L298 546 L78 547"/>
  <rect class="paper" x="70" y="322" width="220" height="216" rx="9"/>
  <path class="line" d="M81 322.4 Q175.6 320.9 279 322.5 Q290.6 322 290 334 Q289.2 430.0 290.4 526 Q290.2 538.8 278 538 Q180.0 539.1 81 537.6 Q69.1 538.5 70 526 Q70.8 430.0 69.6 334 Q69.3 321.8 81 322.4 Z"/>
  <text x="86" y="350" class="chapter">Whole thesis</text>
  <text x="86" y="382">Introduction</text>
  <rect class="highlight" x="83" y="400" width="193" height="32" rx="5"/>
  <text x="95" y="423" class="selected">Research</text>
  <text x="86" y="466">Conclusion</text>
  <text x="86" y="507">References</text>
  <text x="180" y="591" text-anchor="middle" style="font-size:17px">Edit one file.</text>
  <text x="180" y="616" text-anchor="middle" style="font-size:17px">Compile the whole project.</text>
</svg>
