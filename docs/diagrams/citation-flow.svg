<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 612" width="720" height="612" role="img" aria-labelledby="t d">
  <title id="t">How a citation travels</title>
  <desc id="d">How a citation travels, and three things that are not the same. The record: a source saved in a citation manager such as Zotero, with its author, title, and year. The citation key: a short, stable name for that source, here lamport1994, pinned with Better BibTeX and exported with the entry into references.bib; you can also paste an entry into references.bib by hand. In a chapter you write only the key, as \cite{lamport1994}; the keys must match. When you compile, Biber matches the key and formats the citation in your chosen style: [1] in the text, and the full entry under REFERENCES in your PDF. The record, the key, and the formatted citation are different things, and only the key goes in your chapter.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="692">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="720" height="612" rx="18"/>
  <text class="hand hs mid" x="106" y="32" style="font-size:18px">the record, in Zotero</text>
  <rect class="w-sage" x="22" y="52" width="180" height="168" rx="14"/>
  <rect class="card" x="16" y="46" width="180" height="168" rx="14"/>
  <rect class="ln" filter="url(#r)" x="16" y="46" width="180" height="168" rx="14"/>
  <text class="s" x="30" y="78" style="font-size:14px">Author</text>
  <text x="82" y="78" style="font-size:15px">Leslie Lamport</text>
  <text class="s" x="30" y="103" style="font-size:14px">Title</text>
  <text x="82" y="103" style="font-size:15px">LaTeX: A Doc…</text>
  <text class="s" x="30" y="128" style="font-size:14px">Year</text>
  <text x="82" y="128" style="font-size:15px">1994</text>
  <path class="ln thin mut dot" d="M28 148 H184"/>
  <text class="s" x="30" y="172" style="font-size:14px">Citation Key</text>
  <text class="m" x="30" y="196" style="font-size:15.5px"><tspan class="k">lamport1994</tspan></text>
  <text class="hand mid" x="106" y="244" style="font-size:16.5px">key pinned with</text>
  <text class="hand mid" x="106" y="264" style="font-size:16.5px">Better BibTeX</text>
  <text class="hand mid" x="386" y="32" style="font-size:18px">its key, exported</text>
  <path class="w-plum" transform="translate(6 6)" d="M244 46 H506 L522 62 V214 H244 Z"/>
  <path class="card" d="M244 46 H506 L522 62 V214 H244 Z"/>
  <path class="ln" filter="url(#r)" d="M244 46 H506 L522 62 V214 H244 Z M506 46 V62 H522"/>
  <text class="m" x="260" y="76" style="font-size:16.5px">references.bib</text>
  <text class="code" x="260" y="108.5" style="font-size:14.5px">@book{<tspan class="k">lamport1994</tspan>,</text>
  <text class="code" x="260" y="133.5" style="font-size:14.5px" xml:space="preserve">  author = {Leslie Lamport},</text>
  <text class="code" x="260" y="158.5" style="font-size:14.5px" xml:space="preserve">  title  = {LaTeX: …},</text>
  <text class="code" x="260" y="183.5" style="font-size:14.5px" xml:space="preserve">  …}</text>
  <path class="ln" filter="url(#r)" d="M202 128 C 214 120, 226 120, 238 126" marker-end="url(#a)"/>
  <text class="hand mid" x="220" y="108" style="font-size:16px">export</text>
  <rect class="w-butter" x="28" y="306" width="168" height="62" rx="12"/>
  <rect class="ln" filter="url(#r)" x="22" y="300" width="168" height="62" rx="12"/>
  <text class="mid" x="106" y="326" style="font-size:15.5px">or paste an entry</text>
  <text class="s mid" x="106" y="347" style="font-size:15px">by hand</text>
  <path class="ln" filter="url(#r)" d="M196 318 C 214 300, 228 262, 250 226" marker-end="url(#a)"/>
  <path class="ln terra dash" filter="url(#r)" d="M320 226 C 314 248, 326 268, 320 290" marker-start="url(#at)" marker-end="url(#at)"/>
  <text class="hand" x="338" y="264" style="font-size:18px">the keys must match</text>
  <path class="w-blue" transform="translate(6 6)" d="M244 302 H506 L522 318 V406 H244 Z"/>
  <path class="card" d="M244 302 H506 L522 318 V406 H244 Z"/>
  <path class="ln" filter="url(#r)" d="M244 302 H506 L522 318 V406 H244 Z M506 302 V318 H522"/>
  <text class="m" x="260" y="330" style="font-size:14px">chapters/01-introduction.tex</text>
  <text class="code" x="260" y="360" style="font-size:14.5px">…as in this example</text>
  <text class="code" x="260" y="386" style="font-size:14.5px">~\cite{<tspan class="k">lamport1994</tspan>}.</text>
  <text class="hand hb mid" x="386" y="438" style="font-size:18px">you write only the key</text>
  <text class="hand mid" x="633" y="132" style="font-size:17px">when you compile</text>
  <rect class="w-plum" x="566" y="154" width="146" height="96" rx="16"/>
  <rect class="ln" filter="url(#r)" x="560" y="148" width="146" height="96" rx="16"/>
  <text class="h mid" x="633" y="182" style="font-size:21px">Biber</text>
  <text class="s mid" x="633" y="206" style="font-size:15px">matches the key,</text>
  <text class="s mid" x="633" y="226" style="font-size:15px">formats your style</text>
  <path class="ln" filter="url(#r)" d="M530 104 C 546 112, 548 150, 552 176" marker-end="url(#a)"/>
  <path class="ln" filter="url(#r)" d="M530 350 C 552 336, 560 290, 580 252" marker-end="url(#a)"/>
  <path class="w-sage" transform="translate(6 6)" d="M562 290 H686 L702 306 V466 H562 Z"/>
  <path class="card" d="M562 290 H686 L702 306 V466 H562 Z"/>
  <path class="ln" filter="url(#r)" d="M562 290 H686 L702 306 V466 H562 Z M686 290 V306 H702"/>
  <path class="ln thin sage" filter="url(#r)" d="M576 318 H684 M576 334 H666"/>
  <text x="576" y="362" style="font-size:15.5px">this work <tspan class="k">[1]</tspan>.</text>
  <text class="mid" x="632" y="398" style="font-size:14px" font-weight="700">REFERENCES</text>
  <text x="576" y="422" style="font-size:14.5px"><tspan class="k">[1]</tspan> L. Lamport,</text>
  <text class="s" x="576" y="443" style="font-size:14.5px" font-style="italic">LaTeX: A Doc…</text>
  <path class="ln" filter="url(#r)" d="M636 252 C 642 264, 638 274, 636 284" marker-end="url(#a)"/>
  <text class="hand mid" x="632" y="490" style="font-size:17px">the formatted</text>
  <text class="hand mid" x="632" y="510" style="font-size:17px">citation, in your PDF</text>
  <g transform="rotate(-1 310 563)">
  <rect class="w-butter" x="70" y="530" width="480" height="66" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="70" y="530" width="480" height="66" rx="3"/>
  <rect class="w-terra" x="290" y="523" width="40" height="13" opacity=".9"/>
  <text class="mid" x="310" y="558" style="font-size:16px" font-weight="700">Record, key, formatted citation: three different things.</text>
  <text class="mid" x="310" y="580" style="font-size:16px">Only the key goes in your chapter.</text>
  </g>
</svg>
