  <circle class="f-terra" cx="440.4" cy="127.4" r="2.6"/>
  <text class="hand" x="324" y="238" style="font-size:16px">caption below</text>
  <text class="hand" x="324" y="257" style="font-size:16px">a figure, bold</text>
  <path class="ln thin terra" d="M412 240 L440.4 245.4"/>
  <circle class="f-terra" cx="440.4" cy="245.4" r="2.6"/>
  <text class="hand" x="620" y="82" style="font-size:16px">body pages:</text>
  <text class="hand" x="620" y="101" style="font-size:16px">1, 2, 3 …</text>
  <text class="hand" x="620" y="120" style="font-size:16px">at the top right</text>
  <path class="ln thin terra" d="M618 76 L592.6 77.8"/>
  <circle class="f-terra" cx="592.6" cy="77.8" r="2.6"/>
  <text class="hand" x="626" y="258" style="font-size:16px">footnotes</text>
  <text class="hand" x="626" y="277" style="font-size:16px">single-</text>
  <text class="hand" x="626" y="296" style="font-size:16px">spaced</text>
  <path class="ln thin terra" d="M622 262 L585.6 278"/>
  <circle class="f-terra" cx="585.6" cy="278" r="2.6"/>
  <text class="hand mid" x="515" y="344" style="font-size:16px">chapter-opening pages:</text>
  <text class="hand mid" x="515" y="363" style="font-size:16px">at the bottom center</text>
  <g transform="rotate(-1.2 360 422)">
  <rect class="w-butter" x="150" y="392" width="420" height="60" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="150" y="392" width="420" height="60" rx="3"/>
  <rect class="w-terra" x="340" y="385" width="40" height="13" opacity=".9"/>
  <text class="mid" x="360" y="417" style="font-size:15.5px">margins, page numbers, spacing, caption style:</text>
  <text class="mid" x="360" y="438" style="font-size:15.5px">set once in rpi-thesis.cls, so you write the words</text>
  </g>
</svg>
