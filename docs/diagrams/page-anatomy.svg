  <circle class="f-terra" cx="123" cy="207.9" r="2.6"/>
  <text class="hand mid" x="213" y="344" style="font-size:16px">front matter: ii, iii, …</text>
  <text class="hand mid" x="213" y="363" style="font-size:16px">at the bottom center</text>
  <text class="hand" x="324" y="120" style="font-size:16px">caption above</text>
  <text class="hand" x="324" y="139" style="font-size:16px">a table, bold</text>
