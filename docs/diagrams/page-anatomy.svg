  <rect class="ln thin blue dash" x="442.4" y="88.4" width="145.2" height="201.6"/>
  <text class="end" x="587.6" y="82.8" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">3</text>
  <path class="ln thin terra" d="M571.6 66 V82.8 M568.6 66 H574.6 M568.6 82.8 H574.6"/>
  <text class="hand end" x="563.6" y="81.8" style="font-size:14px">0.75 in</text>
  <path class="ln thin mut" d="M445.4 98.4 H584.6 M445.4 112.4 H564.6"/>
  <text x="446.4" y="131.4" style="font-size:13px" font-weight="700">Table 2.1: Sites</text>
  <path class="ln thin" d="M473 137.4 H557 M473 144.4 H557 M473 163.4 H557"/>
  <path class="ln thin mut" d="M481 150.4 H503 M523 150.4 H549 M481 157.4 H499 M523 157.4 H545"/>
  <path class="ln thin mut" d="M455.4 179.4 H584.6 M445.4 193.4 H534.6"/>
  <rect class="ln thin" x="475" y="201.4" width="80" height="32"/>
  <path class="ln thin mut" d="M475 233.4 L501 215.8 L517 225.4 L531 211 L555 233.4"/>
  <text x="446.4" y="249.4" style="font-size:13px" font-weight="700">Figure 2.1: Map</text>
  <path class="ln thin" d="M445.4 264 H486.4"/>
  <path class="ln thin mut" d="M445.4 271 H584.6 M445.4 278 H584.6 M445.4 285 H554.6"/>
  <text class="hand" x="14" y="92" style="font-size:16px">heading at</text>
  <text class="hand" x="14" y="111" style="font-size:16px">the top margin</text>
  <path class="ln thin terra" d="M104 96 L173 94.9"/>
  <circle class="f-terra" cx="173" cy="94.9" r="2.6"/>
  <text class="hand" x="14" y="150" style="font-size:16px">double-</text>
  <text class="hand" x="14" y="169" style="font-size:16px">spaced text</text>
  <path class="ln thin terra" d="M96 158 L180.4 144.9"/>
  <circle class="f-terra" cx="180.4" cy="144.9" r="2.6"/>
