  <text class="end" x="150" y="690" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;fill:var(--sage);font-weight:700">5</text>
  <path class="ln sage" d="M22 684 l3.5 4.2 l7.7 -9.1"/>
