  <path class="w-sage" transform="translate(5 5)" d="M14 604 H146 L160 618 V780 H14 Z"/>
  <path class="card" d="M14 604 H146 L160 618 V780 H14 Z"/>
  <path class="ln" filter="url(#r)" d="M14 604 H146 L160 618 V780 H14 Z M146 604 V618 H160"/>
  <text class="mid" x="87" y="630" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif;font-weight:700">CONTENTS</text>
  <text x="40" y="660" style="font-size:13px;font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif">1. INTRO</text>
