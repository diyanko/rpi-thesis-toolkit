<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-labelledby="t d">
  <title id="t">Build pipeline</title>
  <desc id="d">Build pipeline. Step 1: pdfLaTeX reads main.tex and writes notes about labels, headings, and the citations it needs. Step 2: Biber reads that citation list and references.bib and writes a formatted reference list. Step 3: pdfLaTeX runs again and places the references. Step 4: pdfLaTeX runs once more so page numbers in the contents and cross-references settle. The result is main.pdf.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="620">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="720" height="540" rx="18"/>
  <rect class="w-blue" x="239" y="37" width="252" height="84" rx="16"/>
  <rect class="ln" filter="url(#r)" x="232" y="30" width="252" height="84" rx="16"/>
  <circle class="w-butter" cx="234" cy="32" r="17"/>
  <circle class="ln" filter="url(#r)" cx="234" cy="32" r="17"/>
  <text class="n mid" x="234" y="39">1</text>
  <text class="h mid" x="358.0" y="68">pdfLaTeX</text>
  <text class="s mid" x="358.0" y="95" style="font-size:17px">lays out the pages</text>
  <rect class="w-plum" x="239" y="159" width="252" height="84" rx="16"/>
  <rect class="ln" filter="url(#r)" x="232" y="152" width="252" height="84" rx="16"/>
  <circle class="w-butter" cx="234" cy="154" r="17"/>
  <circle class="ln" filter="url(#r)" cx="234" cy="154" r="17"/>
  <text class="n mid" x="234" y="161">2</text>
  <text class="h mid" x="358.0" y="190">Biber</text>
  <text class="s mid" x="358.0" y="217" style="font-size:17px">builds the reference list</text>
  <rect class="w-blue" x="239" y="281" width="252" height="84" rx="16"/>
  <rect class="ln" filter="url(#r)" x="232" y="274" width="252" height="84" rx="16"/>
  <circle class="w-butter" cx="234" cy="276" r="17"/>
  <circle class="ln" filter="url(#r)" cx="234" cy="276" r="17"/>
  <text class="n mid" x="234" y="283">3</text>
  <text class="h mid" x="358.0" y="312">pdfLaTeX</text>
  <text class="s mid" x="358.0" y="339" style="font-size:17px">places the references</text>
  <rect class="w-blue" x="239" y="403" width="252" height="84" rx="16"/>
  <rect class="ln" filter="url(#r)" x="232" y="396" width="252" height="84" rx="16"/>
  <circle class="w-butter" cx="234" cy="398" r="17"/>
  <circle class="ln" filter="url(#r)" cx="234" cy="398" r="17"/>
  <text class="n mid" x="234" y="405">4</text>
  <text class="h mid" x="358.0" y="434">pdfLaTeX</text>
  <text class="s mid" x="358.0" y="461" style="font-size:17px">settles page numbers</text>
  <path class="ln" filter="url(#r)" d="M358 123 C 355 132, 356 138, 358 146" marker-end="url(#a)"/>
  <path class="ln" filter="url(#r)" d="M358 245 C 355 254, 356 260, 358 268" marker-end="url(#a)"/>
  <path class="ln" filter="url(#r)" d="M358 367 C 355 376, 356 382, 358 390" marker-end="url(#a)"/>
  <path class="w-butter" d="M22 44 H188 L204 60 V114 H22 Z"/>
  <path class="card" d="M16 38 H182 L198 54 V108 H16 Z"/>
  <path class="ln" filter="url(#r)" d="M16 38 H182 L198 54 V108 H16 Z M182 38 V54 H198"/>
  <text class="m" x="32" y="68">main.tex</text>
  <text class="s" x="32" y="94" style="font-size:17px">your thesis</text>
  <path class="ln" filter="url(#r)" d="M202 72 C 210 70, 216 72, 226 72" marker-end="url(#a)"/>
  <path class="w-plum" d="M22 166 H188 L204 182 V236 H22 Z"/>
  <path class="card" d="M16 160 H182 L198 176 V230 H16 Z"/>
  <path class="ln" filter="url(#r)" d="M16 160 H182 L198 176 V230 H16 Z M182 160 V176 H198"/>
  <text class="m" x="30" y="190" style="font-size:16.5px">references.bib</text>
  <text class="s" x="30" y="216" style="font-size:17px">your sources</text>
  <path class="ln" filter="url(#r)" d="M202 194 C 210 192, 216 194, 226 194" marker-end="url(#a)"/>
  <g transform="rotate(-3 615 138)">
  <rect class="w-butter" x="530" y="92" width="170" height="92" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="530" y="92" width="170" height="92" rx="3"/>
  <rect class="w-terra" x="593" y="84" width="44" height="15" opacity=".9"/>
  <text class="m" x="546" y="124" style="font-size:16px">.aux .toc .bcf</text>
  <text class="s" x="546" y="150" style="font-size:17px">notes: labels,</text>
  <text class="s" x="546" y="172" style="font-size:17px">citations used</text>
  </g>
  <text class="hand mid" x="615" y="70" style="font-size:19px">notes for later</text>
  <path class="ln" filter="url(#r)" d="M488 62 C 506 66, 514 84, 524 104" marker-end="url(#a)"/>
  <path class="ln terra" filter="url(#r)" d="M600 190 C 596 214, 540 210, 490 186" marker-end="url(#at)"/>
  <g transform="rotate(3 615 291)">
  <rect class="w-butter" x="540" y="254" width="150" height="74" rx="3"/>
  <rect class="ln thin" filter="url(#r)" x="540" y="254" width="150" height="74" rx="3"/>
  <rect class="w-terra" x="593" y="246" width="44" height="15" opacity=".9"/>
  <text class="m" x="556" y="284">.bbl</text>
  <text class="s" x="556" y="310" style="font-size:17px">reference list</text>
  </g>
  <path class="ln" filter="url(#r)" d="M488 216 C 512 222, 526 238, 538 256" marker-end="url(#a)"/>
  <path class="ln terra" filter="url(#r)" d="M590 334 C 584 356, 536 340, 490 316" marker-end="url(#at)"/>
  <path class="w-sage" d="M572 390 H684 L700 406 V522 H572 Z"/>
  <path class="card" d="M566 384 H678 L694 400 V516 H566 Z"/>
  <path class="ln" filter="url(#r)" d="M566 384 H678 L694 400 V516 H566 Z M678 384 V400 H694"/>
  <path class="ln thin sage" d="M580 430 H680 M580 446 H680 M580 462 H650"/>
  <path class="ln terra" filter="url(#r)" d="M618 488 l8 9 l18 -20"/>
  <text class="m" x="580" y="412" style="font-size:16px">main.pdf</text>
  <path class="ln" filter="url(#r)" d="M488 438 C 512 440, 540 446, 566 450" marker-end="url(#a)"/>
  <text class="hand hb mid" x="104" y="332">One Compile</text>
  <text class="hand hb mid" x="104" y="358">runs these steps</text>
  <text class="hand hb mid" x="104" y="384">as often as needed</text>
  <path class="ln blue" filter="url(#r)" d="M150 400 C 176 418, 196 428, 214 432" marker-end="url(#ab)"/>
</svg>
