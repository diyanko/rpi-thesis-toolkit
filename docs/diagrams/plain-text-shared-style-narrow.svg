<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 610" width="360" height="610" role="img" aria-labelledby="t d">
  <title id="t">Paste words without importing stray formatting</title>
  <desc id="d">Three stacked views show the same teaching text: Research question, Compare the samples., and Describe the result. Copied formatting mixes fonts, sizes and colors. Pasting as plain text keeps the words without those styles. Shared formatting uses one thesis style, with Research question marked as a heading. Keep the words. Leave stray styles behind. Add headings and emphasis in LaTeX.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45; --blue: #2b4d7a; --terra: #9e4526; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8; --blue: #a3c0ea; --terra: #eda482; }
    }
    .bg { fill: var(--bg); } .paper { fill: var(--card); }
    .line { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none; stroke: var(--blue); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 17px; }
    .title { font-size: 24px; font-weight: 700; }
    .label { font-size: 18px; font-weight: 700; }
    .plain { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15.5px; }
    .thesis { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 18px; }
    .note { fill: var(--muted); font-size: 16.5px; }
  
    .note { font-size:16px; } .plain { font-size:16px; } .code { font-size:14px; }
  </style>
  <rect class="bg" width="360" height="610" rx="18"/>
  <text x="20" y="28" class="title" style="font-size:21px">Pasting without stray styles</text>
  <rect class="paper" x="12" y="48" width="336" height="138" rx="9"/>
  <path class="line" d="M23 48.4 Q173.28 46.9 337 48.5 Q348.6 48 348 60 Q347.2 117.0 348.4 174 Q348.2 186.8 336 186 Q180.0 187.1 23 185.6 Q11.1 186.5 12 174 Q12.8 117.0 11.6 60 Q11.3 47.8 23 48.4 Z"/>
  <text x="28" y="74" class="label" style="font-size:18px">Copied formatting</text>
  <text x="28" y="106" style="font-family:Georgia,serif;font-size:21px;font-style:italic;fill:var(--terra)">Research question</text>
  <text x="28" y="137" style="font-size:17px;font-weight:700;fill:var(--blue)">Compare the samples.</text>
  <text x="28" y="168" class="plain">Describe the result.</text>
  <path class="arrow" d="M180 193 Q177 203 180 210 M172 202 L180 210 L188 202"/>
  <rect class="paper" x="12" y="218" width="336" height="138" rx="9"/>
  <path class="line" d="M23 218.4 Q173.28 216.9 337 218.5 Q348.6 218 348 230 Q347.2 287.0 348.4 344 Q348.2 356.8 336 356 Q180.0 357.1 23 355.6 Q11.1 356.5 12 344 Q12.8 287.0 11.6 230 Q11.3 217.8 23 218.4 Z"/>
  <text x="28" y="244" class="label" style="font-size:18px">Paste as plain text</text>
  <text x="28" y="276" class="plain">Research question</text>
  <text x="28" y="307" class="plain">Compare the samples.</text>
  <text x="28" y="338" class="plain">Describe the result.</text>
  <path class="arrow" d="M180 363 Q177 373 180 380 M172 372 L180 380 L188 372"/>
  <rect class="paper" x="12" y="388" width="336" height="138" rx="9"/>
  <path class="line" d="M23 388.4 Q173.28 386.9 337 388.5 Q348.6 388 348 400 Q347.2 457.0 348.4 514 Q348.2 526.8 336 526 Q180.0 527.1 23 525.6 Q11.1 526.5 12 514 Q12.8 457.0 11.6 400 Q11.3 387.8 23 388.4 Z"/>
  <text x="28" y="414" class="label" style="font-size:18px">Shared formatting</text>
  <text x="28" y="446" class="thesis" style="font-size:21px;font-weight:700">Research question</text>
  <text x="28" y="477" class="thesis">Compare the samples.</text>
  <text x="28" y="508" class="thesis">Describe the result.</text>
  <text x="180" y="566" text-anchor="middle" style="font-size:16px">Keep the words. Leave stray styles behind.</text>
  <text x="180" y="592" class="note" text-anchor="middle">Add headings and emphasis in LaTeX.</text>
</svg>
