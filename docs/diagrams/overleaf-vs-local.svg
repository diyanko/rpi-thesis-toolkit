<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 626" width="720" height="626" role="img" aria-labelledby="t d">
  <title id="t">Your computer compared with Overleaf</title>
  <desc id="d">Your computer compared with Overleaf. Both start from the same project files and run the same compile steps (pdfLaTeX, Biber, then pdfLaTeX twice, repeated as needed) to produce matching PDFs when both use a current TeX setup. On your computer the files live in a folder you control, LaTeX is installed locally, and you work offline in an editor. On Overleaf the files and the LaTeX installation live on Overleaf's servers and you work in a browser.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45;
      --terra: #9e4526; --sage: #46684b; --plum: #6b4669; --blue: #2b4d7a; --red: #c8102e;
      --terra-w: #f6e0d3; --sage-w: #e2ebd9; --plum-w: #efe2ed; --blue-w: #dfe7f2; --butter-w: #f7ebbd; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8;
        --terra: #eda482; --sage: #a9c9a1; --plum: #d8b6d3; --blue: #a3c0ea; --red: #ff8d98;
        --terra-w: #3a271e; --sage-w: #263226; --plum-w: #33263a; --blue-w: #222f44; --butter-w: #3a3320; }
    }
    .bg { fill: var(--bg); }
    .card { fill: var(--card); }
    .ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin { stroke-width: 1.6; }
    .dash { stroke-dasharray: 7 7; }
    .dot { stroke-dasharray: 1 7; }
    .terra { stroke: var(--terra); } .sage { stroke: var(--sage); } .plum { stroke: var(--plum); }
    .blue { stroke: var(--blue); } .red { stroke: var(--red); } .mut { stroke: var(--muted); }
    .w-terra { fill: var(--terra-w); } .w-sage { fill: var(--sage-w); } .w-plum { fill: var(--plum-w); }
    .w-blue { fill: var(--blue-w); } .w-butter { fill: var(--butter-w); }
    .f-terra { fill: var(--terra); } .f-red { fill: var(--red); }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 18px; }
    .h { font-size: 22px; font-weight: 700; }
    .s { fill: var(--muted); }
    .m { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: var(--muted); }
    .k { fill: var(--terra); font-weight: 700; }
    .n { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-size: 20px; font-weight: 700; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; font-style: italic; font-size: 20px; fill: var(--terra); }
    .hb { fill: var(--blue); } .hs { fill: var(--sage); } .hp { fill: var(--plum); }
    .mid { text-anchor: middle; } .end { text-anchor: end; }
  </style>
  <defs>
    <filter id="r" filterUnits="userSpaceOnUse" x="-40" y="-40" width="800" height="706">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="a" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="at" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln terra" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="as" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln sage" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ab" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln blue" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ap" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln plum" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
    <marker id="ar" viewBox="0 0 14 14" refX="10" refY="7" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="ln red" d="M3 2.5 L11 7 L3.5 11.5"/></marker>
  </defs>
  <rect class="bg" width="720" height="626" rx="18"/>
  <text class="hand mid" x="360" y="32">the same project files</text>
  <path class="w-butter" d="M262 52 H454 L470 68 V192 H262 Z"/>
  <path class="card" d="M256 46 H448 L464 62 V186 H256 Z"/>
  <path class="ln" filter="url(#r)" d="M256 46 H448 L464 62 V186 H256 Z M448 46 V62 H464"/>
  <text class="m" x="274" y="80">main.tex</text>
  <text class="code" x="274" y="110" style="font-size:17px">metadata.tex</text>
  <text class="code" x="274" y="136" style="font-size:17px">chapters/</text>
  <text class="code" x="274" y="162" style="font-size:17px">references.bib</text>
  <path class="ln" filter="url(#r)" d="M250 140 C 210 150, 180 172, 168 214" marker-end="url(#a)"/>
  <path class="ln" filter="url(#r)" d="M470 140 C 510 150, 538 172, 550 214" marker-end="url(#a)"/>
  <g transform="translate(-388 0)">
    <rect class="w-blue" x="453" y="235" width="216" height="110" rx="10"/>
    <rect class="ln" filter="url(#r)" x="446" y="228" width="216" height="110" rx="10"/>
    <path class="ln" filter="url(#r)" d="M432 352 H676 L666 366 H442 Z"/>
    <text class="h mid" x="554" y="274">Your computer</text>
    <text class="s mid" x="554" y="302">in an editor</text>
    <text class="mid" x="554" y="404">files in your own folder,</text>
    <text class="mid" x="554" y="428">LaTeX installed locally</text>
    <text class="hand mid" x="554" y="458">you can work offline</text>
  </g>
  <g transform="translate(364 0)">
    <path class="w-sage" transform="translate(7 7)" d="M84 332 C 50 332, 46 290, 80 282 C 74 246, 118 232, 140 254 C 156 222, 210 220, 222 254 C 254 238, 292 262, 280 290 C 312 298, 306 336, 274 332 Z"/>
    <path class="ln" filter="url(#r)" d="M84 332 C 50 332, 46 290, 80 282 C 74 246, 118 232, 140 254 C 156 222, 210 220, 222 254 C 254 238, 292 262, 280 290 C 312 298, 306 336, 274 332 Z"/>
    <text class="h mid" x="178" y="290">Overleaf</text>
    <text class="s mid" x="178" y="316">in a browser</text>
    <text class="mid" x="178" y="404">files and LaTeX live</text>
    <text class="mid" x="178" y="428">on Overleaf's servers</text>
    <text class="hand mid" x="178" y="458">you need internet</text>
  </g>
  <text class="hand hp mid" x="360" y="244" style="font-size:18px">same steps</text>
  <rect class="ln thin plum dash" filter="url(#r)" x="304" y="256" width="112" height="132" rx="12"/>
  <text class="m mid" x="360" y="284" style="font-size:15px">pdfLaTeX</text>
  <text class="m mid" x="360" y="330" style="font-size:15px">Biber</text>
  <text class="m mid" x="360" y="376" style="font-size:15px">pdfLaTeX</text>
  <path class="ln plum" filter="url(#r)" d="M360 292 V 312" marker-end="url(#ap)"/>
  <path class="ln plum" filter="url(#r)" d="M360 338 V 358" marker-end="url(#ap)"/>
  <path class="ln" filter="url(#r)" d="M168 476 C 184 520, 250 534, 300 536" marker-end="url(#a)"/>
  <path class="ln" filter="url(#r)" d="M542 476 C 526 520, 478 534, 424 536" marker-end="url(#a)"/>
  <path class="w-sage" d="M316 484 H400 L416 500 V608 H316 Z"/>
  <path class="card" d="M310 478 H394 L410 494 V602 H310 Z"/>
  <path class="ln" filter="url(#r)" d="M310 478 H394 L410 494 V602 H310 Z M394 478 V494 H410"/>
  <path class="ln thin sage" d="M324 524 H396 M324 540 H396 M324 556 H374.4"/>
  <path class="ln terra" filter="url(#r)" d="M348 574 l8 9 l18 -20"/>
  <text class="hand" x="474" y="590">a matching PDF</text>
</svg>
