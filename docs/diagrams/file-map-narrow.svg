  <path class="w-butter" d="M22 24 H156 L172 40 V110 H22 Z"/>
  <path class="card" d="M16 18 H150 L166 34 V104 H16 Z"/>
  <path class="ln" filter="url(#r)" d="M16 18 H150 L166 34 V104 H16 Z M150 18 V34 H166"/>
  <text class="m" x="32" y="50" style="font-size:19px">main.tex</text>
  <text class="s" x="32" y="74" style="font-size:14px">the file you</text>
  <text class="s" x="32" y="93" style="font-size:14px">compile</text>
  <rect class="w-terra" x="202" y="32" width="148" height="70" rx="14"/>
  <rect class="ln" filter="url(#r)" x="196" y="26" width="148" height="70" rx="14"/>
  <text class="m mid" x="270" y="55" style="font-size:14px">rpi-thesis.cls</text>
  <text class="s mid" x="270" y="79" style="font-size:14px">formatting rules</text>
  <path class="ln terra" filter="url(#r)" d="M192 62 C 186 60, 180 64, 172 62" marker-end="url(#at)"/>
  <text class="hand" x="196" y="130" style="font-size:17px">start here</text>
  <path class="ln terra" filter="url(#r)" d="M190 124 C 180 120, 174 116, 168 108" marker-end="url(#at)"/>
  <path class="ln" filter="url(#r)" d="M30 112 C 26 130, 34 150, 30 172" marker-end="url(#a)"/>
  <text class="hand" x="50" y="158" style="font-size:17px">loads, in order</text>
  <path class="ln thin mut dash" filter="url(#r)" d="M34 200 V 548"/>
  <rect class="w-blue" x="67" y="185" width="282" height="54" rx="12"/>
  <rect class="ln" filter="url(#r)" x="62" y="180" width="282" height="54" rx="12"/>
  <circle class="w-butter" cx="34" cy="207" r="15"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="207" r="15"/>
  <text class="n mid" x="34" y="212.25" style="font-size:15px">1</text>
  <text class="m" x="76" y="203" style="font-size:16px">preamble.tex</text>
  <text class="s" x="76" y="224" style="font-size:14px">packages, citation style</text>
  <rect class="w-blue" x="67" y="251" width="282" height="54" rx="12"/>
  <rect class="ln" filter="url(#r)" x="62" y="246" width="282" height="54" rx="12"/>
  <circle class="w-butter" cx="34" cy="273" r="15"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="273" r="15"/>
  <text class="n mid" x="34" y="278.25" style="font-size:15px">2</text>
  <text class="m" x="76" y="269" style="font-size:16px">metadata.tex</text>
  <text class="s" x="76" y="290" style="font-size:14px">your name, degree, committee</text>
  <rect class="w-sage" x="67" y="317" width="282" height="54" rx="12"/>
  <rect class="ln" filter="url(#r)" x="62" y="312" width="282" height="54" rx="12"/>
  <circle class="w-butter" cx="34" cy="339" r="15"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="339" r="15"/>
  <text class="n mid" x="34" y="344.25" style="font-size:15px">3</text>
  <text class="m" x="76" y="335" style="font-size:16px">frontmatter/</text>
  <text class="s" x="76" y="356" style="font-size:14px">abstract, acknowledgments</text>
  <rect class="w-sage" x="67" y="383" width="282" height="54" rx="12"/>
  <rect class="ln" filter="url(#r)" x="62" y="378" width="282" height="54" rx="12"/>
  <circle class="w-butter" cx="34" cy="405" r="15"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="405" r="15"/>
  <text class="n mid" x="34" y="410.25" style="font-size:15px">4</text>
  <text class="m" x="76" y="401" style="font-size:16px">chapters/</text>
  <text class="s" x="76" y="422" style="font-size:14px">your writing</text>
  <rect class="w-plum" x="67" y="449" width="282" height="54" rx="12"/>
  <rect class="ln" filter="url(#r)" x="62" y="444" width="282" height="54" rx="12"/>
  <circle class="w-butter" cx="34" cy="471" r="15"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="471" r="15"/>
  <text class="n mid" x="34" y="476.25" style="font-size:15px">5</text>
  <text class="m" x="76" y="467" style="font-size:16px">references.bib</text>
  <text class="s" x="76" y="488" style="font-size:14px">→ the reference list</text>
  <rect class="w-sage" x="67" y="515" width="282" height="54" rx="12"/>
  <rect class="ln" filter="url(#r)" x="62" y="510" width="282" height="54" rx="12"/>
  <circle class="w-butter" cx="34" cy="537" r="15"/>
  <circle class="ln" filter="url(#r)" cx="34" cy="537" r="15"/>
