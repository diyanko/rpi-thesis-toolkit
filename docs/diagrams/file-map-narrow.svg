  <path class="ln" filter="url(#r)" d="M16 604 V 676 H226 V 616 H118 L106 604 Z"/>
  <text class="m" x="32" y="642" style="font-size:16px">figures/</text>
  <text class="s" x="32" y="664" style="font-size:14px">images for chapters</text>
