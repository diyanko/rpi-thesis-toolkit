  <rect class="w-sage" x="469" y="47" width="246" height="318.353" rx="3"/>
  <rect class="card" x="462" y="40" width="246" height="318.353" rx="3"/>
  <rect class="ln" filter="url(#r)" x="462" y="40" width="246" height="318.353" rx="3"/>
  <text class="mid" x="585" y="71.8353" style="font-size:14px" font-weight="700">YOUR THESIS TITLE</text>
  <text class="mid" x="585" y="95.7118" style="font-size:13.5px" font-weight="700">Your full name</text>
  <rect x="508.74" y="108.924" width="152.52" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <rect x="548.1" y="117.838" width="73.8" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <text class="mid" x="585" y="137.098" style="font-size:13px" font-style="italic">DOCTOR OF PHILOSOPHY</text>
  <rect x="553.02" y="152.857" width="63.96" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <text class="mid" x="585" y="168.933" style="font-size:13px">Your committee chair, Chair</text>
  <text class="mid" x="585" y="185.933" style="font-size:13px">Committee member two</text>
  <text class="mid" x="585" y="202.933" style="font-size:13px">Committee member three</text>
  <circle class="ln thin mut dash" cx="585" cy="248.521" r="24.6"/>
  <text class="s" x="617.6" y="237.721" style="font-size:12px" font-style="italic">RPI seal</text>
  <text class="s" x="617.6" y="252.721" style="font-size:12px" font-style="italic">(added by</text>
  <text class="s" x="617.6" y="267.721" style="font-size:12px" font-style="italic">the class)</text>
  <text class="mid" x="585" y="294.682" style="font-size:11px" font-style="italic">Department of Your Full Department Name</text>
  <rect x="523.5" y="304.711" width="123" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <rect x="548.1" y="314.262" width="73.8" height="3.5" rx="1.75" style="fill:var(--muted);opacity:.5"/>
  <text class="mid" x="585" y="336.068" style="font-size:13px">[May 2027]</text>
  <circle class="w-butter" cx="444" cy="67.2853" r="10"/>
  <circle class="ln" filter="url(#r)" cx="444" cy="67.2853" r="10"/>
  <text class="n mid" x="444" y="71.8353" style="font-size:13px">1</text>
  <circle class="w-butter" cx="444" cy="91.1618" r="10"/>
  <circle class="ln" filter="url(#r)" cx="444" cy="91.1618" r="10"/>
  <text class="n mid" x="444" y="95.7118" style="font-size:13px">2</text>
  <circle class="w-butter" cx="444" cy="132.548" r="10"/>
  <circle class="ln" filter="url(#r)" cx="444" cy="132.548" r="10"/>
  <text class="n mid" x="444" y="137.098" style="font-size:13px">3</text>
  <circle class="w-butter" cx="444" cy="181.383" r="10"/>
  <circle class="ln" filter="url(#r)" cx="444" cy="181.383" r="10"/>
  <text class="n mid" x="444" y="185.933" style="font-size:13px">4</text>
