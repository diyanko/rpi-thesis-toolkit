<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-labelledby="t d">
  <title id="t">Add a chapter</title>
  <desc id="d">Three steps. 1: create a new file, chapters/04-discussion.tex, containing \chapter{Discussion}, \label{chap:discussion}, and your first paragraph. 2: add one line to main.tex, \include{chapters/04-discussion}, where the chapter belongs: here after \include{chapters/02-research} and before \include{chapters/03-conclusion}. 3: compile. The contents now list 1 Introduction, 2 Research, 3 Discussion, 4 Conclusion: the order of the lines in main.tex sets the chapter numbers, not the file names.</desc>
  <style>
    svg { --bg: #faf5ea; --card: #fffcf5; --ink: #2d2620; --muted: #625547;
      --terra: #a24a24; --sage: #4a6b42; --plum: #70466a; --blue: #24518c; --red: #c8102e;
      --terra-w: #f6dfcd; --sage-w: #e4ecd2; --plum-w: #f1e0ea; --blue-w: #e0e6ef; --butter-w: #f7e8b3; }
