<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t d">
  <title id="t">One chapter at a time</title>
  <desc id="d">A chapter file named chapters/02-research.tex is open for editing on the left. A highlighted line says Your latest edit. A compile arrow connects the file to a whole-thesis document on the right, where Research is highlighted between Introduction and Discussion, followed by References. main.tex brings the files together. Edit one file. Compile the whole project.</desc>
  <style>
    svg { --bg: #fbf7ef; --card: #fffdf8; --ink: #2b2723; --muted: #574e45; --blue: #2b4d7a; --blue-w: #dfe7f2; }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #1c1a17; --card: #282420; --ink: #efe8dc; --muted: #c3b8a8; --blue: #a3c0ea; --blue-w: #222f44; }
    }
    .bg { fill: var(--bg); } .paper { fill: var(--card); } .highlight { fill: var(--blue-w); }
    .line { fill: none; stroke: var(--ink); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .soft { stroke: var(--muted); stroke-width: 1.3; opacity: .65; }
    .arrow { fill: none; stroke: var(--blue); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    text { fill: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 17px; }
    .title { font-size: 24px; font-weight: 700; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15.5px; }
    .note { fill: var(--muted); font-size: 15.5px; }
    .chapter { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 21px; font-weight: 700; }
    .selected { fill: var(--blue); font-weight: 700; }
  </style>
  <rect class="bg" width="640" height="400" rx="18"/>
  <text class="title" x="20" y="32">One chapter at a time</text>
  <text class="note" x="22" y="63">Open a chapter file</text>
  <text class="note" x="360" y="63"><tspan class="code">main.tex</tspan> brings files together</text>

