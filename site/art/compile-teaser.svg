<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-labelledby="title desc">
  <title id="title">Compile turns your files into a PDF</title>
  <desc id="desc">Your plain-text files go in on the left. When you press Compile, pdfLaTeX and Biber take turns over a few passes. Your finished, formatted PDF comes out on the right.</desc>
  <style>
    .ink    { stroke: #2b2723; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .thin   { stroke-width: 1.6; }
    .paper  { fill: #fffdf8; }
    .blue-w { fill: #dce5f1; }
    .plum-w { fill: #ecdeeb; }
    .sage-w { fill: #dbe7d1; }
    .butter-w { fill: #f5e6ad; }
    .terra-w  { fill: #f4d8c8; }
    .shadow { fill: #e9e0cf; }
    .terra-s { stroke: #9e4526; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .blue-s  { stroke: #2b4d7a; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .sage-s  { stroke: #46684b; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .t    { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #2b2723; }
    .h    { font-size: 27px; font-weight: 700; }
    .sub  { font-size: 17px; fill: #574e45; }
    .mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 18px; font-weight: 700; fill: #2b2723; }
    .num  { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 19px; font-weight: 700; fill: #2b2723; }
    .hand { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-style: italic; font-size: 23px; fill: #9e4526; }
    .hand.b { fill: #2b4d7a; }
    @media (prefers-color-scheme: dark) {
      .ink    { stroke: #efe8dc; }
      .paper  { fill: #2a2621; }
      .blue-w { fill: #24324a; }
      .plum-w { fill: #3a2b3b; }
      .sage-w { fill: #2c3a2b; }
      .butter-w { fill: #4a4022; }
      .terra-w  { fill: #43291e; }
      .shadow { fill: #34302a; }
      .terra-s { stroke: #eda482; }
      .blue-s  { stroke: #a3c0ea; }
      .sage-s  { stroke: #a9c9a1; }
      .t, .mono, .num { fill: #efe8dc; }
      .sub  { fill: #c3b8a8; }
      .hand { fill: #eda482; }
      .hand.b { fill: #a3c0ea; }
    }
    .dash { stroke-dasharray: 7 7; }
    .key  { fill: #9e4526; }
    .code { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; fill: #3b342e; }
    .muted { fill: #574e45; }
    @media (prefers-color-scheme: dark) {
      .key { fill: #eda482; }
      .code { fill: #e4dccf; }
      .muted { fill: #c3b8a8; }
    }
    /* A halo the color of the page behind each handwritten note keeps it readable
       where it crosses a line, and if a browser draws this picture in the other theme. */
    .hand { paint-order: stroke; stroke: #f3ecdf; stroke-width: 5px; stroke-linejoin: round; }
    @media (prefers-color-scheme: dark) { .hand { stroke: #24211d; } }
  </style>
