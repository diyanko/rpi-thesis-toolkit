<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Site mark: braces hugging a red dot. Used as the browser-tab icon. The header
       wordmark (site/guide-template.html) and site/og-card.svg carry copies, so a
       new mark goes in all three places. -->
  <style>
    .brace { fill: none; stroke: #2d2620; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .dot { fill: #c8102e; }
    @media (prefers-color-scheme: dark) {
      .brace { stroke: #f2ece2; }
      .dot { fill: #ff5a6e; }
    }
  </style>
  <path class="brace" d="M12 4.5 C8 4.3 8.3 7.5 8.4 10.5 C8.5 13.5 7.7 15.4 4.5 16 C7.8 16.7 8.6 18.6 8.4 21.5 C8.2 24.6 8.1 27.8 12 27.6"/>
  <path class="brace" d="M20 4.5 C24 4.3 23.7 7.5 23.6 10.5 C23.5 13.5 24.3 15.4 27.5 16 C24.2 16.7 23.4 18.6 23.6 21.5 C23.8 24.6 23.9 27.8 20 27.6"/>
  <path class="dot" d="M12 16.2 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0 Z"/>
</svg>
